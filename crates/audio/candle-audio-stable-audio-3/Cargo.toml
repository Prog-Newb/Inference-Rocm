[package]
name = "candle-audio-stable-audio-3"
version = "0.0.0"
edition = "2021"
description = "Stable Audio 3 small-music, small-sfx, medium and their -base Candle text-to-audio providers."
license = "Apache-2.0"
repository = "https://github.com/SceneWorks/inference"
keywords = ["candle", "audio", "diffusion", "stable-audio"]
categories = ["science"]

[dependencies]
# Shared audio DSP/mel/ops/WAV, validation harness, device policy, gen-core identity, and the
# workspace's exact candle-core build. In particular, resampling is consumed from
# `candle_audio::dsp::resample`; this crate does not carry a second implementation.
candle-audio = { path = "../candle-audio" }
candle-nn = { workspace = true }
# The audio-lane snapshot-preparer contracts.
core-llm = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Audio-lane side of the intentional 0.21/0.22 split enforced by check-workspace.py.
tokenizers = { workspace = true }

[dev-dependencies]
# Bounded-resampler work counters are test-only; production still uses the feature-free dependency
# above.
candle-audio = { path = "../candle-audio", features = ["testkit"] }
# Test adapters are *written* by the suite, in the on-disk format `crate::adapters` declares, so
# the format is exercised through a real file rather than through an in-memory shortcut. Candle's
# own `save` cannot emit `__metadata__`, which the native format requires.
safetensors = { workspace = true }
sceneworks-gen-core-testkit = { workspace = true }
# Self-removing fixture roots for the test suites (sc-17755).
tempfile = { workspace = true }

[features]
default = []
# Keep candle-core (through candle-audio) and candle-nn on the same backend.
metal = ["candle-audio/metal", "candle-nn/metal"]
cuda = ["candle-audio/cuda", "candle-nn/cuda"]
