[package]
name = "candle-gen-mage"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
cuda = ["candle-gen/cuda", "candle-gen-boogu/cuda", "candle-transformers/cuda"]
testkit = ["candle-gen/testkit"]

[dependencies]
candle-gen = { path = "../candle-gen" }
candle-gen-boogu = { path = "../candle-gen-boogu" }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
sceneworks-gen-core = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
safetensors07 = { package = "safetensors", version = "0.7" }

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
candle-gen = { path = "../candle-gen", features = ["testkit"] }
sceneworks-gen-core-testkit = { workspace = true }
