[package]
name = "mlx-gen-flux"
version = "0.0.0"
edition = "2021"
description = "FLUX.1 provider crate for mlx-gen."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "diffusion", "flux", "inference"]
categories = ["science"]

[dependencies]
mlx-gen = { path = ".." }
mlx-gen-z-image = { path = "../mlx-gen-z-image" }
# Optional PiD super-resolving decoder (epic 7840, sc-7846): the FLUX.1 16-ch VAE latent space has a
# PiD student, so `run_denoise` routes the final decode through `mlx_gen_pid::PidDecoder` when
# `req.use_pid` is set. `mlx-gen-pid` depends only on core (no dep on this crate), so it's acyclic.
mlx-gen-pid = { path = "../mlx-gen-pid" }
# Reuse the CLIP ViT vision tower + CLIP image preprocessing for the XLabs IP-Adapter image
# encoder (sc-3622). Same reuse pattern as mlx-gen-svd → mlx-gen-sdxl; no dependency cycle
# (sdxl does not depend on flux).
mlx-gen-sdxl = { path = "../mlx-gen-sdxl" }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Link-time self-registration into mlx-gen's model registry.
# Offline pre-quantization converter (sc-8669): annotate the packed tier's config.json.
serde_json = { workspace = true }
# Header-only dtype/shape validation of admitted safetensors artifacts.
safetensors = { workspace = true }
# Exact content identities for deferred-materialization inventory pins (SC-15514).
sha2 = { workspace = true }

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
# PNG dump of the Rust render for visual inspection in the e2e parity test.
image = { workspace = true }
