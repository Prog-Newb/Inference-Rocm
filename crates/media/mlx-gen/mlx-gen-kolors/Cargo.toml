[package]
name = "mlx-gen-kolors"
version = "0.0.0"
edition = "2021"
description = "Kolors (SDXL-family U-Net + ChatGLM3-6B text encoder) provider for mlx-gen — bilingual Chinese/English T2I."
license = "Apache-2.0"
repository = "https://github.com/michaeltrefry/mlx-gen"
keywords = ["mlx", "apple-silicon", "kolors", "chatglm", "inference"]
categories = ["science"]

[dependencies]
mlx-gen = { path = ".." }
# Kolors reuses the SDXL U-Net + VAE + sampler. The U-Net gains an auto-detected `encoder_hid_proj`
# for the ChatGLM3 4096→2048 context projection (see `UNetConfig::kolors`).
mlx-gen-sdxl = { path = "../mlx-gen-sdxl" }
# Optional PiD super-resolving decoder overlay (epic 7840, sc-7848): Kolors shares the SDXL VAE
# latent space, so it reuses the `sdxl` PiD student via the same `decode_image` seam. pid → core only.
mlx-gen-pid = { path = "../mlx-gen-pid" }
# Must match the core crate's MLX binding exactly (shared `Array` type). See root Cargo.toml.
mlx-rs = { workspace = true }
# Link-time model registration (the `mlx_gen` registry; mirrors mlx-gen-sdxl). sc-3874.
# Decode training-dataset images for the LoRA/LoKr trainer (sc-4568); mirrors mlx-gen-sdxl.
image = { workspace = true }

[dev-dependencies]
# RAII fixture roots for the test helpers (sc-17791). A `TempDir` guard removes the tree on
# `Drop` — including out of a panicking test, which is the only path the old
# `env::temp_dir().join(..)` + trailing `remove_dir_all` shape ever leaked on.
tempfile = { workspace = true }
# Weights-free memory-strategy conformance for the shared ladder (SC-15521).
sceneworks-gen-core-testkit = { workspace = true }
# Read the U-Net safetensors header directly, so the rung-4 weight-set arithmetic is cross-checked
# against the snapshot rather than against a doc comment (SC-15521).
serde_json = { workspace = true }
# Synthesize tiny safetensors snapshots so the asset-fact projections (the f32 VAE and the resident
# overlays, sc-15839) are asserted against real headers without a multi-GB tier.
safetensors = { workspace = true }
