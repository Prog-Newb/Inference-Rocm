# Pinned real-weight model catalogue.
#
# `environment` names the variables that point a real-weight test at this model's snapshot. Every
# such name is expected to be referenced somewhere under `.github/workflows/` — otherwise the model
# is provisioned, pinned and stored, but the tests it gates run nowhere. That is not a hypothetical:
# an exhaustive cross-check in sc-17266 found eleven such keys at once, several of them backing
# real conformance and parity gates that had never executed.
#
# `test_manifest_environment_keys_are_wired_or_explicitly_exempt` in
# `scripts/tests/test_ci_workflow_policy.py` enforces this both ways. A model whose keys are
# deliberately NOT wired must say so in `unwired_reason`, and a model that carries an
# `unwired_reason` must NOT be referenced — so an exemption cannot quietly outlive its reason.
schema_version = 1
captured_on = "2026-07-12"

