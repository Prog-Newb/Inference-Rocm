# The `media-cuda-residency-ab` profile is operator-run by design, not a CI lane:
# `scripts/release/run-residency-ab.ps1` drives it by hand, and
# `test_residency_ab_is_operator_run_without_ci_model_dependencies` asserts this variable never
# appears in real-weights.yml. Wiring it would contradict that recorded decision, so the exemption
# is recorded here instead (sc-17266). Note the repository variable's value
# (C:\Users\Michael\.cache\huggingface\hub\models--Qwen--Qwen-Image\...) does not currently exist on
# nax-windows, so a lane added today would fail closed on materialization anyway.
#
# THIS NAME NO LONGER HAS AN MLX CONSUMER (sc-17284). Until then the 45 mlx-gen-qwen-image
# real-weight tests read QWEN_IMAGE_SNAPSHOT too — and fed it something this row does not describe.
# The repo's own provenance receipt records what they were actually given:
# `tools/adapter_parity_receipt.json` recorded those runs under QWEN_IMAGE_SNAPSHOT at
# `models--SceneWorks--qwen-image-mlx/snapshots/8080a417…/bf16` — the sc-17651 re-record now
# pins that same path under MLX_GEN_QWEN_SNAPSHOT — an MLX re-host at a different
# revision of a different repository from the `Qwen/Qwen-Image@75e0b4be` pinned here. One name
# cannot be verified against two pins: `ensure_model_snapshot.py --model qwen-image` checks for
# revision 75e0b4be and would fail closed on the re-host. So the MLX half was renamed to
# MLX_GEN_QWEN_SNAPSHOT (matching the sibling crate's MLX_GEN_FLUX_SNAPSHOT) and given its own
# `qwen-image-mlx` row below, which the macOS `mlx-qwen-image` lane wires.
