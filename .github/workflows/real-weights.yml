          python scripts/ci/make_test_image.py "%EDIT_SRC%" 768 768 || exit /b 1
          python scripts/ci/make_test_image.py "%IP_REF%" 768 768 || exit /b 1
      - name: Run SDXL real-weight renders
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked -p candle-gen-sdxl --features cuda --release --test conformance sdxl_conformance -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-gen-sdxl --features cuda --release --test conformance sdxl_cfg_off_guidance_one_render -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-gen-sdxl --features cuda --release --lib edit_validate::real_weight_edit -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-gen-sdxl --features cuda --release --lib ip_validate::real_weight_ip_adapter -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-gen-sdxl --features cuda --release --test trainer_e2e sdxl_trainer_lora_trains_reloads_and_renders -- --ignored --nocapture || exit /b 1

  candle-mmaudio:
    name: Candle mmaudio real weights (CUDA)
    # mmaudio video->audio runs under the `audio` profile (on the CUDA runner — candle is CUDA/CPU).
    # The MMAudio DiT/VAE (CC-BY-NC-4.0) + DFN5B-CLIP (Apple ML Research License) are research/non-
    # commercial; SceneWorks is non-commercial and surfaces these licenses to the user (epic-12833
    # decision), so running them in the regression guard is in-policy.
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 120
    env:
      # Three per-repo snapshot dirs the video->audio harness resolves the 5 components from
      # (tests/common/mod.rs): hkchengrex/MMAudio (synchformer + dit 16k/44k + vae 16k/44k + 16k
      # vocoder), canonical apple/DFN5B-CLIP-ViT-H-14-378 (clip), nvidia/bigvgan (44k vocoder).
      MMAUDIO_MMAUDIO_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_CLIP_SNAPSHOT: ${{ vars.MMAUDIO_CLIP_SNAPSHOT }}
      # The nvidia 44k vocoder repo. The repository VARIABLE is still named MMAUDIO_BIGVGAN_SNAPSHOT
      # (renaming it is an out-of-band action on the box); the env var the crate reads is
      # MMAUDIO_BIGVGAN_V2_SNAPSHOT, because MMAUDIO_BIGVGAN_SNAPSHOT means hkchengrex/MMAudio's
      # *16k* best_netG.pt everywhere else (manifest + conformance_output.rs) — sc-17266.
      MMAUDIO_BIGVGAN_V2_SNAPSHOT: ${{ vars.MMAUDIO_BIGVGAN_SNAPSHOT }}
      # Standalone encoder conformance (sc-13474): the Synchformer + DFN5B-CLIP encoder tests read
      # their OWN env vars. Point them at the SAME snapshots the video->audio provider tests already
      # materialize above (no extra materialize step needed): synchformer resolves under
      # <MMAUDIO_MMAUDIO_SNAPSHOT>/ext_weights/synchformer_state_dict.pth (model.rs::load), and the CLIP
      # tower at <MMAUDIO_CLIP_SNAPSHOT>/open_clip_pytorch_model.bin (clip.rs::load).
      SYNCHFORMER_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      DFN_CLIP_SNAPSHOT: ${{ vars.MMAUDIO_CLIP_SNAPSHOT }}
      # Standalone component conformance (sc-17266): the MM-DiT / 16k-decoder / 44k-decoder tests
      # each read their own per-component var, all four of which resolve INSIDE the hkchengrex
      # snapshot already materialized above (vae 16k -> ext_weights/v1-16.pth, 16k vocoder ->
      # ext_weights/best_netG.pt, vae 44k -> ext_weights/v1-44.pth, dit 16k ->
      # weights/mmaudio_small_16k.pth). These were declared in release/real-weight-models.toml but
      # exported by no job, so the three test binaries below had never run anywhere.
      MMAUDIO_DIT_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_VAE_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_BIGVGAN_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      MMAUDIO_VAE_44K_SNAPSHOT: ${{ vars.MMAUDIO_MMAUDIO_SNAPSHOT }}
      # 80 on the Ampere runner; set 120 on a Blackwell runner (matches the other CUDA jobs here).
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Configure runner-local MMAudio output paths
        shell: cmd
        run: |
          echo MMAUDIO_WAV_OUT=%RUNNER_TEMP%\mmaudio_foley_16k.wav>>"%GITHUB_ENV%"
          echo MMAUDIO_WAV_OUT_44K=%RUNNER_TEMP%\mmaudio_foley_44k.wav>>"%GITHUB_ENV%"
      - name: Materialize and verify immutable snapshots
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          rem hkchengrex/MMAudio is a 54 GB repo (~46 GB of training checkpoints + weight variants the
          rem inference stack never loads); each catalog key carries a `download_files` allow-list so
          rem only the pinned checkpoint is fetched (~8 GB across the six components into one dir).
          python scripts/release/ensure_model_snapshot.py --model synchformer --snapshot "%MMAUDIO_MMAUDIO_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mmaudio-small-16k --snapshot "%MMAUDIO_MMAUDIO_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mmaudio-large-44k-v2 --snapshot "%MMAUDIO_MMAUDIO_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mmaudio-vae-16k --snapshot "%MMAUDIO_MMAUDIO_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mmaudio-vae-44k --snapshot "%MMAUDIO_MMAUDIO_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model mmaudio-bigvgan-16k --snapshot "%MMAUDIO_MMAUDIO_SNAPSHOT%" || exit /b 1
          rem The stable catalog key still ends in 384 because MMAudio feeds 384px; its repository is
          rem the canonical -378 checkpoint declared in release/real-weight-models.toml.
          python scripts/release/ensure_model_snapshot.py --model dfn5b-clip-vit-h14-384 --snapshot "%MMAUDIO_CLIP_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model nvidia-bigvgan-v2-44khz-128band-512x --snapshot "%MMAUDIO_BIGVGAN_V2_SNAPSHOT%" || exit /b 1
      - name: Run mmaudio real-weight renders
        shell: cmd
        run: |
          call "%VCVARS%"
          rem Standalone encoder conformance (sc-13474): the Synchformer sync encoder and the DFN5B-CLIP
          rem visual+text tower — the two component encoders the video->audio pipeline below composes.
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test conformance -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test clip_conformance -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test conformance_video_to_audio -- --ignored --nocapture || exit /b 1
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test conformance_video_to_audio_44k -- --ignored --nocapture || exit /b 1
      # Standalone component conformance (sc-17266). These three binaries were never invoked by any
      # lane, so the MM-DiT flow/sampler and both decoder stages had ZERO automated coverage even
      # though the manifest declared and pinned their checkpoints.
      #
      # Selected by name with `--exact` + a run-count assertion, NOT by whole test binary: an
      # `#[ignore]` test that stops matching reports "0 passed; N filtered out" and cargo exits 0, so
      # a rename would silently delete the only coverage these have. `--exact` must come AFTER `--`;
      # before it, cargo rejects the argument outright and the step never runs at all.
      #
      # The last five entries are the torch-parity gates (sc-17285) — the strongest correctness
      # evidence this port has. The conformance tests above prove shape, finiteness, range and
      # determinism; only these compare the candle numbers against the PyTorch reference, so only
      # these would catch a subtly wrong weight mapping that still produces plausible audio.
      #
      # All five were unreachable until sc-17285: each read a dump path from an environment variable
      # that no workflow set and no committed script produced. Two of them —
      # conformance_output::output_16k_matches_reference (then `output_parity_dump`) and
      # mmdit_conformance::mmdit_matches_reference — additionally `return`ed early to a PASSING
      # result when their variable was unset, which is why sc-17266 had to exclude them by name
      # here rather than inherit a vacuous green. Their references are now committed fixtures under
      # tests/fixtures/, resolved from CARGO_MANIFEST_DIR by
      # `scripts/reference/mmaudio_reference.py`, so there is no unset case and no exclusion left.
      - name: Run mmaudio standalone component and torch-parity conformance
        shell: cmd
        run: |
          call "%VCVARS%"
          call :run_one conformance_output output_latent_to_waveform_finite_deterministic || exit /b 1
          call :run_one conformance_output_44k output_44k_latent_to_waveform_finite_deterministic || exit /b 1
          call :run_one mmdit_conformance mmdit_flow_shape_finite_deterministic || exit /b 1
          call :run_one mmdit_conformance mmdit_sample_shape_finite_deterministic || exit /b 1
          call :run_one conformance_output output_16k_matches_reference || exit /b 1
          call :run_one mmdit_conformance mmdit_matches_reference || exit /b 1
          call :run_one parity_reference assembly_matches_reference_waveform || exit /b 1
          call :run_one parity_reference_44k assembly_44k_matches_reference_waveform || exit /b 1
          call :run_one parity_reference_44k_decoder decoder_44k_matches_reference_mel_and_waveform || exit /b 1
          exit /b 0

          :run_one
          set "log=%RUNNER_TEMP%\mmaudio-%~2.log"
          cargo test --locked -p candle-audio-mmaudio --features cuda --release --test %~1 %~2 -- --ignored --exact --nocapture > "%log%" 2>&1 || (type "%log%" & exit /b 1)
          type "%log%"
          findstr /C:"test result: ok. 1 passed" "%log%" >nul || (echo ::error::%~2 did not run exactly one passing test - a rename would make this step vacuously green & exit /b 1)
          exit /b 0
