      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Toolchain and hardware versions
        shell: cmd
        run: |
          call "%VCVARS%"
          rustc --version
          cargo --version
          nvidia-smi
      - name: Run the crate unit tests against real CUDA
        shell: cmd
        # Weight-free and seconds long. `zero_element_tensors_load_on_the_target_device` is the
        # regression gate for the zero-byte `noise_scaling_factor` buffer: on CUDA the F32 load
        # succeeded but the F32-to-F16 cast launched a zero-sized grid, which is why medium loaded at
        # F32 and failed at F16. This is the cheapest place that failure can be caught, and it runs
        # before the 10.4 GB downloads.
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --lib || exit /b 1
      - name: Materialize and verify the immutable snapshots
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium --snapshot "%SA3_MEDIUM_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium-base --snapshot "%SA3_MEDIUM_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music --snapshot "%SA3_SMALL_MUSIC_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx --snapshot "%SA3_SMALL_SFX_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model same-l --snapshot "%SA3_SAME_L_SNAPSHOT%" || exit /b 1
      - name: Run medium conformance on CUDA
        shell: cmd
        # sc-14546 moved `--test variant_binding` to `sa3-base-identity-cuda` (all six snapshots).
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test conformance registered_medium_provider_passes_full_audio_conformance -- --ignored --nocapture || exit /b 1
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test conformance concurrent_medium_requests_are_deterministic_and_do_not_share_rng_state -- --ignored --nocapture || exit /b 1
      - name: Re-calibrate the medium stereo-width floor on CUDA
        shell: cmd
        run: |
          call "%VCVARS%"
          REM The render step below enforces the side-ratio floor on this backend, so the sweep
          REM behind it runs on this backend at the render's own 30 s / 8 steps.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test provider medium_stereo_width_floor_is_calibrated_across_prompts_and_seeds -- --ignored --nocapture || exit /b 1
      - name: Run registered medium-base conformance and its calibrated render on CUDA
        shell: cmd
        # sc-14546, mirroring the Metal job: this job already provisions
        # `stable-audio-3-medium-base` for the identity gates, and the side-ratio floor the render
        # enforces on this backend is re-calibrated on this backend first.
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test conformance registered_medium_base_provider_passes_full_audio_conformance -- --ignored --nocapture || exit /b 1
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test conformance concurrent_medium_base_requests_are_deterministic_and_do_not_share_rng_state -- --ignored --nocapture || exit /b 1
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test provider medium_base_stereo_width_floor_is_calibrated_across_prompts_and_seeds -- --ignored --nocapture || exit /b 1
      - name: Render a real medium-base CUDA WAV at the variant defaults
        shell: powershell
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          $env:SA3_MEDIUM_BASE_WAV_OUT = Join-Path $env:RUNNER_TEMP "sa3-medium-base-cuda.wav"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda `
            --test provider connected_medium_base_generation_at_its_own_defaults_is_stereo_finite_and_exact_length `
            -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 $env:SA3_MEDIUM_BASE_WAV_OUT
      - name: Prove medium serves both domains and measure the compute policy on CUDA
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test variant_quality -- --ignored --nocapture || exit /b 1
          REM The F16-vs-F32 measurement behind the shipped F32 policy, taken on the backend
          REM upstream would half-cast. sc-14545 could only measure it on Metal.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test dtype_policy -- --ignored --nocapture || exit /b 1
      - name: Measure the long-form renders and peak CUDA allocation
        shell: powershell
        # A `nvidia-smi` sample taken *after* `cargo test` returns cannot observe a peak: the test
        # process has already exited and the driver has freed its VRAM, so the "post-run" reading is
        # the baseline again. Sample continuously for the whole render instead, which is the pattern
        # `same-l-cuda`'s `Invoke-SameLProbe` already uses in this file. The release build is done
        # first with `--no-run` so the sampled window contains the render and nothing else.
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          $env:SA3_MEDIUM_LONG_SECONDS = "120,300,380"
          $env:SA3_MEDIUM_LONG_WAV_DIR = $env:RUNNER_TEMP
          cargo test --locked --release --no-run -p candle-audio-stable-audio-3 --features cuda `
            --test provider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stdout = Join-Path $env:RUNNER_TEMP "sa3-medium-long-form.stdout"
          $stderr = Join-Path $env:RUNNER_TEMP "sa3-medium-long-form.stderr"
          $stop = Join-Path $env:RUNNER_TEMP "sa3-medium-long-form.stop"
          Remove-Item $stop -ErrorAction SilentlyContinue
          $arguments = @(
            "test", "--locked", "--release",
            "-p", "candle-audio-stable-audio-3", "--features", "cuda",
            "--test", "provider", "medium_long_form_renders_are_exact_and_timed",
            "--", "--ignored", "--nocapture"
          )
          # Resolve an absolute path in the parent scope and hand it to the job. `Start-Job` runs the
          # scriptblock in a separate runspace that resolves commands from its own `PATH`, which is
          # not guaranteed to be the one the vcvars import above installed into this scope; a bare
          # `nvidia-smi` inside the job would surface as a CommandNotFound terminating error rather
          # than a measurement. The bare form does in fact work on this runner today — run
          # 30196371019's `SAME-L real weights (CUDA)` job logged
          # `SA3_SAME_L_CUDA_MEMORY case=literal-380s baseline_total_mib=12252 peak_total_mib=28069`
          # from the identical `Invoke-SameLProbe` sampler, which is proof the job runspace both
          # resolved the tool and observed a real in-render peak. This binds it explicitly anyway so
          # the failure mode is a named throw in the parent rather than a dead sampler, and so the
          # resolved path is in the log. `Invoke-SameLProbe` above is deliberately left as-is: it is
          # already green in a recorded run and this PR does not re-open it.
          $nvidiaSmi = (Get-Command nvidia-smi -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1)
          if (-not $nvidiaSmi) {
            throw "nvidia-smi is not resolvable on PATH; cannot measure peak CUDA allocation"
          }
          $nvidiaSmiPath = $nvidiaSmi.Source
          Write-Host "nvidia-smi resolved to $nvidiaSmiPath"
          $baselineOutput = @(& $nvidiaSmiPath --query-gpu=memory.used --format=csv,noheader,nounits)
          if ($LASTEXITCODE -ne 0) {
            throw "nvidia-smi baseline query failed with exit code $LASTEXITCODE"
          }
          $baselineMiB = 0
          $baselineText = [string]($baselineOutput | Select-Object -First 1)
          if (-not [int]::TryParse($baselineText.Trim(), [ref]$baselineMiB)) {
            throw "nvidia-smi baseline query returned an invalid value: '$baselineText'"
          }
          $sampler = Start-Job -ArgumentList $nvidiaSmiPath, $stop, $baselineMiB -ScriptBlock {
            param([string]$nvidiaSmiPath, [string]$stopPath, [int]$peakMiB)
            while (-not (Test-Path $stopPath)) {
              $sampleOutput = @(& $nvidiaSmiPath --query-gpu=memory.used --format=csv,noheader,nounits)
              if ($LASTEXITCODE -ne 0) {
                throw "nvidia-smi sampler query failed with exit code $LASTEXITCODE"
              }
              $usedMiB = 0
              $sampleText = [string]($sampleOutput | Select-Object -First 1)
              if (-not [int]::TryParse($sampleText.Trim(), [ref]$usedMiB)) {
                throw "nvidia-smi sampler query returned an invalid value: '$sampleText'"
              }
              $peakMiB = [Math]::Max($peakMiB, $usedMiB)
              Start-Sleep -Milliseconds 250
            }
            $peakMiB
          }
          try {
            $process = Start-Process cargo -ArgumentList $arguments -Wait -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } finally {
            New-Item $stop -ItemType File -Force | Out-Null
          }
          Wait-Job $sampler | Out-Null
          $samplerState = $sampler.State
          try {
            $samplerOutput = @(Receive-Job $sampler -ErrorAction Stop)
          } finally {
            Remove-Job $sampler -Force
          }
          if ($samplerState -ne "Completed") {
            throw "nvidia-smi sampler job ended in state $samplerState"
          }
          if ($samplerOutput.Count -ne 1) {
            throw "nvidia-smi sampler returned $($samplerOutput.Count) values; expected one"
          }
          $peakMiB = 0
          if (-not [int]::TryParse(([string]$samplerOutput[0]).Trim(), [ref]$peakMiB)) {
            throw "nvidia-smi sampler returned an invalid peak: '$($samplerOutput[0])'"
          }
          Get-Content $stdout
          Get-Content $stderr
          Write-Host "SA3_MEDIUM_CUDA_MEMORY baseline_total_mib=$baselineMiB peak_total_mib=$peakMiB peak_delta_mib=$($peakMiB - $baselineMiB)"
          if ($process.ExitCode -ne 0) {
            throw "medium long-form render failed with exit code $($process.ExitCode)"
          }
          # The sampler seeds its running peak with the baseline, so a sampler that observed nothing
          # still returns the baseline and reports peak_delta_mib=0 — indistinguishable from "the
          # render allocated no VRAM". A real medium render allocates gigabytes, so a zero delta
          # means the probe is broken, not that the render was free.
          if ($peakMiB -le $baselineMiB) {
            throw ("nvidia-smi sampler observed no allocation above the $baselineMiB MiB baseline " +
              "(peak $peakMiB MiB); the peak probe measured nothing")
          }
          foreach ($seconds in 120, 300, 380) {
            Get-FileHash -Algorithm SHA256 (Join-Path $env:RUNNER_TEMP "sa3-medium-${seconds}s.wav")
          }
          # Start-Process does not update LASTEXITCODE, and the vcvars bootstrap above can leave a
          # stale non-zero value that GitHub's PowerShell wrapper would propagate.
          exit 0
      - name: Render a real 30-second eight-step medium CUDA WAV
        shell: powershell
        run: |
          cmd /c "call `"$env:VCVARS`" && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") { Set-Item -Force "env:$($matches[1])" $matches[2] }
            }
          $env:SA3_TEST_DURATION = "30"
          $env:SA3_TEST_STEPS = "8"
          $env:SA3_MEDIUM_WAV_OUT = Join-Path $env:RUNNER_TEMP "sa3-medium-cuda.wav"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda `
            --test provider connected_medium_generation_is_stereo_finite_and_exact_length `
            -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 $env:SA3_MEDIUM_WAV_OUT

  sa3-base-identity-cuda:
    name: Stable Audio 3 base/post-trained identity matrix (CUDA)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'sa3-base-identity'
    runs-on: [self-hosted, windows, cuda, real-weights]
    timeout-minutes: 120
    env:
      SA3_TEST_CUDA: "1"
      SA3_REQUIRE_ALL_SNAPSHOTS: "1"
      CUDA_COMPUTE_CAP: "80"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.9"
      VCVARS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure all six immutable Stable Audio 3 snapshot paths
        shell: cmd
        run: |
          python scripts/release/export_model_snapshot_paths.py --model stable-audio-3-small-music --model stable-audio-3-small-sfx --model stable-audio-3-medium --model stable-audio-3-small-music-base --model stable-audio-3-small-sfx-base --model stable-audio-3-medium-base --model same-l
      - name: Select Git Bash
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Toolchain and hardware versions
        shell: cmd
        run: |
          call "%VCVARS%"
          rustc --version
          cargo --version
          nvidia-smi
      - name: Materialize and verify all six immutable snapshots
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "%RUNNER_TEMP%\huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-windows-x64-py312.txt
          set "PYTHONPATH=%RUNNER_TEMP%\huggingface-hub"
          rem The three `-base` entries carry `download_files` allow-lists, so the 6.4 GB of
          rem `svd_bases.pt` training pickles across them are not fetched.
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music --snapshot "%SA3_SMALL_MUSIC_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx --snapshot "%SA3_SMALL_SFX_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium --snapshot "%SA3_MEDIUM_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-music-base --snapshot "%SA3_SMALL_MUSIC_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-small-sfx-base --snapshot "%SA3_SMALL_SFX_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model stable-audio-3-medium-base --snapshot "%SA3_MEDIUM_BASE_SNAPSHOT%" || exit /b 1
          python scripts/release/ensure_model_snapshot.py --model same-l --snapshot "%SA3_SAME_L_SNAPSHOT%" || exit /b 1
      - name: Reject every cross-variant weight path and match the frozen-Torch sampler oracles
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test variant_binding -- --ignored --nocapture || exit /b 1
          rem Named rather than `--test sampler_oracle -- --ignored`: the third ignored case in that
          rem target is an operator resource probe that requires SA3_RESOURCE_* and fails without it.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test sampler_oracle all_six_real_p0_pingpong_trajectories_match_stepwise -- --ignored --nocapture || exit /b 1
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test sampler_oracle real_sampler_cfg_apg_scale_phi_matches_frozen_upstream -- --ignored --nocapture || exit /b 1
      - name: Prove real CFG and the negative prompt on a base checkpoint
        shell: cmd
        run: |
          call "%VCVARS%"
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test base_guidance -- --ignored --nocapture || exit /b 1
      - name: Certify the explicit-negative conditioning path itself
        shell: cmd
        run: |
          call "%VCVARS%"
          rem `base_guidance`'s divergence assertion proves the negative prompt reaches the model,
          rem not that the batch-2 path is wired correctly. This case is the only one that separates
          rem absent negative conditioning — which zeroes the whole cross context — from an explicit
          rem all-invalid negative prompt, which keeps its conditioned duration row. It ran in no
          rem lane before sc-14546. Named rather than `--test dit_oracle -- --ignored`: the other
          rem ignored cases need all six snapshots on CPU or an explicit SA3_DIT_CASE_ENV selection,
          rem and wiring the rest of `dit_oracle` is sc-15235.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test dit_oracle real_weights_detect_conditioning_mutations_and_exercise_cfg_apg -- --ignored --nocapture || exit /b 1
      - name: Prove the audio-to-audio restyle path on all six checkpoints
        shell: cmd
        run: |
          call "%VCVARS%"
          rem sc-14547. This job and its Metal twin are the only lanes provisioning all six
          rem snapshots, and the story's acceptance is "every registered variant". Both ignored
          rem cases run: the sweep asserts retained structure, a divergence floor, and the strength
          rem direction through the full graph, and the draw-order case is the only observation that
          rem separates "initial noise first, then the source encode" from the reverse.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test reference_audio -- --ignored --nocapture || exit /b 1
      - name: Prove inpaint, repaint and extend on all six checkpoints
        shell: cmd
        run: |
          call "%VCVARS%"
          rem sc-14548. This job and its Metal twin are the only lanes provisioning all six
          rem snapshots. All four ignored cases run: exact outside-region preservation plus a
          rem measured interior divergence (preservation alone passes for a no-op), Repaint/Inpaint
          rem byte equality, the pinned 10s -> 18s extend with an exact prefix and a seam bound
          rem derived from the material, and the draw order — which only medium/medium-base can
          rem falsify, since SAME-S consumes zero draws on encode. This is also the only lane that
          rem reaches the three weights-only edit sites named in
          rem docs/migration/SC_14548_AUDIO_EDIT_INPAINT.md.
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test audio_edit -- --ignored --nocapture || exit /b 1
      - name: Prove the load-time adapter fold on all six checkpoints
        shell: cmd
        run: |
          call "%VCVARS%"
          rem sc-14550. This job and its Metal twin are the only lanes provisioning all six
          rem snapshots. These cases do NOT validate a real adapter artifact -- none exists
          rem (sc-15347); every adapter is synthesized by the test against the real checkpoint's own
          rem safetensors header. What they prove is that the resolved plan reaches the real backend
          rem and that the fold changes the rendered audio. The two gates are exactly signed: a
          rem scale-0.0 request renders byte-identical audio to a request with no adapters, and two
          rem adapters differing only in their factors render different audio. "Adapted differs from
          rem un-adapted" is liveness only, because a misapplied adapter differs too.
          rem The -xs case is scoped to the conditioner's [768, 256] Linear: the deterministic host
          rem f64 SVD costs ~1.9 s there and ~113 s at [1024, 1024].
          cargo test --locked --release -p candle-audio-stable-audio-3 --features cuda --test adapters -- --ignored --nocapture || exit /b 1

