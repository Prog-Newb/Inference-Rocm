          # LAION CLAP audio embedder (sc-12851): the first real AudioEmbedder (semantic audio-text
          # joint-space retrieval). Embeds a set of real clips spanning categories (a Kokoro speech
          # clip from the snapshot above, a tone, and white noise) and asserts a TEXT query ranks its
          # matching clip highest by cosine — the cross-modal ranking DoD — plus embedding determinism.
          cargo test --locked --release -p candle-audio-clap --test conformance cross_modal_query_ranks_matching_clip_highest -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-clap --test conformance embedding_is_deterministic -- --ignored --nocapture

  candle-audio-moss-tts:
    name: Candle audio real weights (MOSS-TTSD dialogue)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'audio-moss-tts'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 120
    env:
      CHATTERBOX_VE_SNAPSHOT: ${{ vars.CHATTERBOX_VE_SNAPSHOT }}
      MOSS_TTSD_SNAPSHOT: ${{ vars.MOSS_TTSD_SNAPSHOT }}
      MOSS_XY_TOKENIZER_SNAPSHOT: ${{ vars.MOSS_XY_TOKENIZER_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          CHATTERBOX_VE_SNAPSHOT MOSS_TTSD_SNAPSHOT MOSS_XY_TOKENIZER_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          CHATTERBOX_VE_SNAPSHOT MOSS_TTSD_SNAPSHOT MOSS_XY_TOKENIZER_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model chatterbox-ve --snapshot "$CHATTERBOX_VE_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model moss-ttsd-v05 --snapshot "$MOSS_TTSD_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model xy-tokenizer-ttsd --snapshot "$MOSS_XY_TOKENIZER_SNAPSHOT"
      - name: Run provider conformance
        run: |
          # MOSS-TTSD-v0.5 multi-speaker dialogue TTS (sc-13360 AR brain + sc-13518 XY_Tokenizer
          # codec). The Qwen3 backbone + 8-channel delay-pattern loop emits real, deterministic RVQ
          # frames; a 2-speaker [S1]/[S2] script shapes the token stream vs a single-voice control;
          # and the ported XY_Tokenizer codec renders those frames into one 24 kHz AudioTrack whose two
          # speakers are acoustically distinct (measured via chatterbox_ve — cross-segment cosine below
          # same-segment self-similarity), with a single-voice control and byte-identical re-synth. The
          # non-English gate (task 12906) checks a Chinese prompt renders distinct real audio.
          cargo test --locked --release -p candle-audio-moss-tts --test conformance moss_ttsd_emits_valid_delay_pattern_rvq_frames -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-moss-tts --test conformance moss_ttsd_two_speaker_script_shapes_the_token_stream -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-moss-tts --test conformance moss_ttsd_renders_multi_speaker_audio -- --ignored --nocapture
          cargo test --locked --release -p candle-audio-moss-tts --test conformance moss_ttsd_renders_non_english -- --ignored --nocapture

  # sc-17250: MOSS-TTS-Realtime is a DIFFERENT model from the MOSS-TTSD dialogue family above — the
  # sc-13334 streaming-TTS AR brain (~4.4 GB) plus the sc-13392 MOSS-Audio-Tokenizer RLFQ codec
  # (~7.1 GB, the figure the crate and the model manifest both use; `du` reports it as 6.6 GiB).
  # Both snapshots sat on a runner for a year with NO workflow running the eleven
  # `#[ignore]` tests they back. ALL ELEVEN are wired below; there is no exclusion left. sc-17250
  # wired eight; sc-17270 closed the one HALF-gated invocation among them (the codec cross-check
  # below); sc-17264 added the two voice-clone tests, which used to hard-require
  # `MOSS_VOICECLONE_REF` — a 24 kHz f32-LE reference clip that existed in no repo, on no Hub and in
  # no provisioning script, and is now a committed fixture rendered by Kokoro (the repo's sanctioned
  # reference-audio path, as in candle-audio-chatterbox-ve's embed_demo), so there is nothing to
  # provision. sc-17263 wired the eleventh, the chunked-encode gate: it failed on a machine-
  # sensitive memory assertion because the probe sampled `ps -o rss=` on a 5 ms timer, and now
  # measures an allocator high-water mark instead. Nothing here is wired to a path that would not
  # resolve or to an assertion already known to be red.
  #
  # `MOSS_AUDIO_TOKENIZER_SNAPSHOT` is new with this job: the codec became a passed-in component in
  # sc-13662, so the provider no longer self-fetches it and every test here fails without it.
  #
  # Budget: PROVISIONAL, like every other family that has not completed a weekly run. Ten
  # invocations were measured `--release` on an M5 Max dev box against these exact pinned
  # revisions — 1178 s of test time total, of which the five whisper/CAMPPlus round-trip gates are
  # 1088 s (asr_roundtrip 235 s, multi_turn_conversation 254 s, multi_turn_user_context 141 s,
  # voice_clone 207 s, multi_turn_voice_clone 250 s); the five others are 3.99 / 6.04 / 18.1 /
  # 23.3 / 38.6 s. sc-17263's chunked-encode gate is the eleventh, at 67-106 s over five runs (a
  # 7.1 GB codec load, a single-shot `[1,20,3200,3200]` CPU attention, three chunked encodes) —
  # call the lane ~1280 s. 120 minutes is ~5.6x that, to absorb a slower runner plus the
  # `--release` build of the candle tree — which was cold every week until the workflow-level
  # `CARGO_TARGET_DIR` above survived `clean: true`, and is now cold only on a box's first run.
  #
  # Treat every figure above as a floor, for two measured reasons. The codec cross-check's number
  # predates sc-17270 widening it to actually run the reference-parity arm. And re-timing the five
  # cheap arms on a dev box busy with other work gave 12.5 / 26.2 / 29.4 / 62.8 / 101.2 s —
  # uniformly ~2.6-3x the quiet-box figures, from contention alone. That spread is why these stay
  # PROVISIONAL instead of being rewritten every time someone re-runs them on a different load.
  # Re-size from the first weekly that executes this lane (sc-17057's scope).
  candle-audio-moss-tts-realtime:
    name: Candle audio real weights (MOSS-TTS-Realtime streaming)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'audio-moss-tts-realtime'
    runs-on: [self-hosted, macOS, ARM64, rw-audio]
    timeout-minutes: 120
    env:
      MOSS_TTS_REALTIME_SNAPSHOT: ${{ vars.MOSS_TTS_REALTIME_SNAPSHOT }}
      MOSS_AUDIO_TOKENIZER_SNAPSHOT: ${{ vars.MOSS_AUDIO_TOKENIZER_SNAPSHOT }}
      WHISPER_SNAPSHOT: ${{ vars.WHISPER_SNAPSHOT }}
      CHATTERBOX_SNAPSHOT: ${{ vars.CHATTERBOX_SNAPSHOT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          MOSS_TTS_REALTIME_SNAPSHOT MOSS_AUDIO_TOKENIZER_SNAPSHOT WHISPER_SNAPSHOT CHATTERBOX_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # An unset repo variable would otherwise reach `ensure_model_snapshot.py` as an empty path and
      # fail as a confusing "revision mismatch" rather than "you did not configure this lane".
      - name: Require the operator-provisioned snapshot paths
        run: |
          for v in MOSS_TTS_REALTIME_SNAPSHOT MOSS_AUDIO_TOKENIZER_SNAPSHOT WHISPER_SNAPSHOT CHATTERBOX_SNAPSHOT; do
            if [[ -z "${!v}" ]]; then
              echo "Repository variable $v is unset; this lane cannot resolve its snapshot path" >&2
              exit 1
            fi
            if [[ "${!v}" != /* ]]; then
              echo "$v must be an absolute path, got: ${!v}" >&2
              exit 1
            fi
          done
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          MOSS_TTS_REALTIME_SNAPSHOT MOSS_AUDIO_TOKENIZER_SNAPSHOT WHISPER_SNAPSHOT CHATTERBOX_SNAPSHOT
      - name: Materialize and verify immutable snapshots
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model moss-tts-realtime --snapshot "$MOSS_TTS_REALTIME_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model moss-audio-tokenizer --snapshot "$MOSS_AUDIO_TOKENIZER_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model whisper-base --snapshot "$WHISPER_SNAPSHOT"
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py --model chatterbox --snapshot "$CHATTERBOX_SNAPSHOT"
      # `--exact` + a run-count assertion: selecting by bare name means a rename yields
      # "0 passed; N filtered out" and a GREEN step, silently deleting the only coverage these have.
      # `--exact` belongs AFTER the `--`; it is a libtest flag, and cargo rejects it in its own
      # argument position.
      - name: Run MOSS-TTS-Realtime provider conformance
        env:
          MOSS_TTS_REALTIME_WAV_OUT: ${{ runner.temp }}/moss_tts_realtime_streaming_demo.wav
        run: |
          set -o pipefail
          run_one() {
            local name="$1"
            local out
            out="$(cargo test --locked --release -p candle-audio-moss-tts-realtime --test conformance \
              "$name" -- --exact --ignored --nocapture 2>&1 | tee /dev/stderr)"
            if ! grep -qE "test result: ok\. 1 passed" <<<"$out"; then
              echo "::error::'$name' did not run exactly one passing test — a rename would make this step vacuously green" >&2
              return 1
            fi
          }
          # Codec-only (no AR): the RLFQ decode path turns synthetic in-range codes into a non-silent
          # 1920-samples-per-frame waveform. Isolates a codec-decode bug from an AR->codec mapping bug.
          run_one codec_only_decodes_synthetic_frames
          # FULLY GATED as of sc-17270. Both halves run with no provisioning: the self-contained
          # decode -> encode -> decode round-trip (reconstruction correlation, non-silent) AND the
          # reference-parity arm comparing this port's encode against the reference PyTorch
          # `codec.encode` across all 16 codebooks. That arm used to sit behind
          # `if let Ok(MOSS_CODEC_CLIP), Ok(MOSS_CODEC_REF_CODES)` with neither variable set
          # anywhere in the repo, so it took the `else` branch, printed "SKIPPED", and still
          # reported `1 passed` — a false green the run-count assertion could not see, the same
          # shape sc-17250 fixed in joycaption.rs one level further out. Both now default to a
          # committed fixture (`crates/audio/candle-audio-moss-tts-realtime/tests/fixtures/`,
          # regenerated by `scripts/reference/moss_audio_codec_reference.py`); the variables
          # survive only as an override for a different clip. Nothing to provision here.
          run_one moss_audio_codec_encode_roundtrip_and_reference
          # The sc-14181 DoD: chunked/streaming encode reproduces single-shot codes exactly (0/6400
          # differing at both chunk durations) AND bounds the first stage's quadratic attention.
          # Was unwired while its memory half sampled `ps -o rss=` on a 5 ms timer — a wall-clock
          # proxy for a transient, so a faster box caught less of the spike and the gate's verdict
          # tracked machine speed (it read 291 MB of a 1669 MB spike here and failed a >200 MB bar).
          # sc-17263 moved that half to an allocator high-water mark: +68 MB chunked vs +1669 MB
          # single-shot, and it goes RED when `forward_chunked` is degraded to the unbounded
          # `forward` (which the identity half alone does NOT catch). The bounds carry deliberate
          # headroom over those dev-box figures — this runner is not that box, and rayon scratch
          # scales with core count.
          # KEEP THIS LANE FEATURELESS. The memory half counts HEAP, so it REFUSES to run when the
          # codec loads onto a non-CPU device — it asserts rather than skipping, precisely so it
          # cannot go green while measuring nothing (sc-17270's rule, gated by
          # scripts/tests/test_moss_audio_codec_reference.py). Adding `--features metal` here turns
          # this step RED with an explanatory message rather than silently dropping the coverage.
          run_one moss_audio_codec_chunked_encode_matches_single_shot
          # AR stage: a fixed text + seed emits >= 2 real 16-codebook RVQ frames, every token in
          # [0, 1027), deterministic run-to-run and non-degenerate. A broken backbone / weight mapping /
          # RoPE / multi-embedding sum / local-transformer head would fail here.
          run_one moss_tts_realtime_emits_valid_rvq_frames
          # The AR loop is genuinely incremental: time-to-first-frame is materially below time-to-budget.
          run_one moss_tts_realtime_is_incremental
          # The sc-13334 streaming acceptance gate through the REAL registered provider: >= 2 PCM chunks
          # before completion, concat(chunks) byte-identical to one-shot generate(), a valid non-silent
          # 24 kHz mono track, and first-chunk latency below full-generation latency.
          run_one moss_tts_realtime_streaming_gate
          # sc-13433 text fidelity: a curated prompt set is synthesized and transcribed back with
          # whisper_base; each transcript must match within a CER bound (and the metric must
          # discriminate — an unrelated reference does NOT pass the same bound). This is the regression
          # gate for the pre-sc-13433 spurious early-EOS failure.
          run_one moss_tts_realtime_asr_roundtrip_fidelity
          # sc-14150/14151 multi-turn: one warm core across turns. Cross-turn speaker continuity is
          # measured with the Chatterbox CAMPPlus x-vector encoder; the user-context arm proves a later
          # turn actually conditions on the earlier one.
          run_one moss_tts_realtime_multi_turn_conversation
          run_one moss_tts_realtime_multi_turn_user_context
          # sc-14149/sc-14151 voice cloning, wired by sc-17264. Both condition on a committed
          # reference clip (`tests/fixtures/moss_voiceclone_ref_clip.f32`, rendered by Kokoro),
          # so `MOSS_VOICECLONE_REF` no longer has to be provisioned — it only overrides.
          # Single-turn: the cloned and default renders are both intelligible (Whisper CER), differ
          # from each other, and the clone's CAMPPlus x-vector resembles the reference MORE than the
          # default voice does. Measured on an M5 Max: clone<->ref 0.912 vs default<->ref 0.719.
          run_one moss_tts_realtime_voice_clone
          # Multi-turn: the sc-14151 DoD that the clone is held across the WHOLE conversation, not
          # just turn 0 — every turn must carry the reference speaker more than the default voice,
          # and the turns must be mutually the same speaker. Measured: turn0 0.837 vs 0.555,
          # turn1 0.883 vs 0.621, cross-turn 0.870.
          run_one moss_tts_realtime_multi_turn_voice_clone

  same-l-metal:
    name: SAME-L real weights (Metal)
    if: github.event_name == 'schedule' || inputs.profile == 'all' || inputs.profile == 'audio' || inputs.profile == 'same-l'
