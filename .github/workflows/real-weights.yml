name: Real-weight validation

# RUNNER LABELS NAME WEIGHT SETS, NOT MACHINES.
#
# Each macOS job selects the label of the weight set it needs, and a box carries the labels for
# the sets it actually stores. Moving a family between Macs is then a runner-label change with no
# edit here — which is the point, because the placement below is a disk-budget decision that will
# keep moving, and it should not cost a workflow PR each time.
#
#   LABEL       WEIGHT SET                                          ON DISK   HOST
#   rw-mage     Mage-Flow x4 + Z-Image + the Mage oracle bundle      ~96 GiB   BOTH boxes
#   rw-mage     Qwen-Image + Qwen-Image-Edit + Fun-Controlnet-Union  ~170 GiB  BOTH boxes
#               MLX re-hosts, both PiD students, Gemma-2-2B,
#               FLUX.1-dev, two lightx2v Lightning LoRAs  (sc-17284)
#   rw-sa3      Stable Audio 3 / SAME                                ~0        nax-macos
#   rw-krea     Krea Realtime 14B + Wan style/distill LoRAs          ~20 GiB   nax-macos-2
#   rw-audio    Kokoro, MOSS SFX/TTSD/TTS-Realtime, ACE-Step, ...    ~42 GiB   nax-macos-2
#   rw-llm      SmolLM2-135M + Qwen3-0.6B + JoyCaption               ~19 GiB   nax-macos-2
#   rw-chroma   none stored; materializes from the Hub per run       ~0        BOTH boxes
#
# `rw-chroma` carries no stored bytes, so it is registered on both boxes and its jobs land on
# whichever is free — verified 2026-08-04 by mapping `runner_name` across the last 40 runs, where
# all three `Chroma packed auxiliaries` matrix legs are observed on `nax-macos` AND `nax-macos-2`.
# This row read `nax-macos-2` until then, which understated the contention it adds to that box.
#
# ON DISK is GiB as `du -sh` reports it, summed over each set's `models--*` repo directories.
# MEASURED 2026-08-03 (sc-17271); previously these were arithmetic, and rw-audio was carrying a
# ~3 GiB overstatement from being derived as 34 + 11 rather than measured. If you edit a row,
# measure it — and say which unit, because 42 GiB and 45 GB are the same number of bytes.
#
# `rw-mage` IS NOT PINNED — it is registered on BOTH boxes. This block used to claim it was "pinned
# to `nax-macos` by the one asset here that cannot self-heal: the ~461 MB frozen-Torch oracle bundle
# behind `MAGE_ORACLE_SEED_DIR`". A label is not a pin, and this one is on both: observed 2026-08-05
# (sc-17284) when `mlx-qwen-image-producers` ran on `nax-macos-2` with
# `labels=self-hosted,macOS,ARM64,rw-mage`, which a runner cannot accept unless it carries every
# requested label.
#
# What IS true about the bundle is the invariant that replaces the pin. `MAGE_ORACLE_SEED_DIR` is
# `~/Library/Application Support/SceneWorks/oracles/sc-14052-mage-flow` — a `~/`-relative value
# resolved per-runner by `resolve_snapshot_paths.py`, so it is ONE setting naming a DIFFERENT
# directory on each box. It exists on no Hub and this workflow deliberately refuses to regenerate it
# in Actions, so it cannot self-heal. Therefore: **every box carrying `rw-mage` must have the bundle
# provisioned by hand, and adding the label to a box without it is what actually breaks `mlx-media`
# — not moving the label around.**
#
# Both boxes have the bundle, confirmed 2026-08-05. `nax-macos` was checked from a shell on the box:
# 461 MB, all 18 required files present as regular non-symlink files, which is exactly what `Require
# operator-provisioned Mage oracle seed` demands. `nax-macos-2` was confirmed by direct operator
# inspection, which is the strongest check available — no job or script in this repo can read that
# box's filesystem. That step remains the enforcement: it fails closed with a named error on a cache
# miss, so a box that quietly loses its copy surfaces as a red `mlx-media`, never a wrong oracle.

# `rw-sa3` stores nothing between runs (it materializes into `RUNNER_TEMP`), so it is the free
# rebalancing knob: move it to shift ~83 min of wall clock without moving a single stored byte.
# It does need the runner-local Hugging Face credential for the six gated `stabilityai/*` repos.
#
# The sc-17284 Qwen/FLUX set is the largest row here and it transferred almost nothing: all of it
# but the two ~0.85 GB Lightning LoRAs was already resident. "Already there" is still not "free" —
# these were opportunistic app/dev cache that could be reclaimed, and wiring them makes them
# CI-REQUIRED; the 31.4 GiB FLUX.1-dev snapshot in particular changes status because `flux-1-dev`
# gains `media-macos`. Measured 2026-08-04 with `du -sh` over the nine `models--*` repo dirs on
# `nax-macos`; the two scheduled jobs consume ~131 GiB of that (`q4` is stored, no wired test
# selects it).
#
# THE TWO BOXES ARE NOT EQUALLY TIGHT, so read that cost per host. `nax-macos` is the 98% box
# (sc-17271). `nax-macos-2` reported 1.0 TiB free at 45% capacity on 2026-08-05, with the 85 GiB
# `qwen-image-mlx` re-host already resident there too — measured by this lane's own
# `report_runner_disk_headroom.sh` step, which is what that step is for. The other six models in
# the set are NOT confirmed on `nax-macos-2`; a job landing there materializes whatever is missing.
#
# A LABEL NO RUNNER CARRIES DOES NOT FAIL — IT QUEUES, SILENTLY, UNTIL THE RUN IS CANCELLED.
# Retiring a box means moving its labels first.
#
# EVERY macOS STEP NAMES `python3.12`, NEVER BARE `python3`.
#
# The macOS wheel lock is a reviewed CPython 3.12 set (its header resolves with `--abi cp312`) and
# every pin in it floors at 3.10. Bare `python3` is not that interpreter — it is whatever the
# runner's launchd `.path` resolves first, and on a box where /usr/bin precedes Homebrew that is
# Apple's system Python 3.9. pip on 3.9 does not report the mismatch as a version problem: it
# filters the whole reviewed set out of the candidate list and calls the pin nonexistent
# ("No matching distribution found for anyio==4.14.2", or click==8.4.2 against an older lock).
# That took out every rw-* job on nax-macos-2 on 2026-08-03, hours after the split above first
# routed twelve jobs onto a box whose `python3` is 3.9.6.
#
# The `PYTHONPATH=… python3.12 scripts/release/…` lines are load-bearing for the same reason one
# stage later: they import the tree the pip step installed, so they must be the same interpreter
# that installed it. scripts/tests/test_ci_workflow_policy.py enforces both halves; a bare
# `python3` anywhere in a macOS job fails that gate.

on:
  schedule:
    # 02:00 UTC Monday = 22:00 EDT Sunday. The macOS jobs are split across two self-hosted Metal
    # runners by the labels above, but each box still runs its own share one at a time, so this run
    # wants a whole night rather than a Sunday-morning start that bleeds into the working day.
    # Cron is always UTC and does not
    # follow US daylight time, so this lands at 21:00 EST once the clocks go back — still Sunday
    # night, which is what matters. GitHub's scheduler also drifts under load (2026-08-02 the old
    # cron fired ~2h late), so treat the start time as approximate.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Real-weight profile to run
        type: choice
        required: true
        default: all
        # `audio` still runs every audio family. The `audio-*` entries are the per-family split
        # (sc-16981) — dispatch one provider family without taking the Metal runner for the rest.
        options: [all, llm, llm-joycaption, media, mage-memory-ladder, chroma-auxiliary, chroma-memory-ladder, qwen-image, qwen-image-pid, qwen-image-producers, request-memory-scope, memory-evidence-v1, sana-drift-ceiling, krea-realtime, krea-kv-cache, krea-s18-sweep, scail2, audio, audio-kokoro, audio-moss-sfx, audio-acestep, audio-voice, audio-chatterbox, audio-asr, audio-moss-tts, audio-moss-tts-realtime, same-l, same-chunked, sa3-small-music, sa3-small-sfx, sa3-medium, sa3-base-identity, sa3-small-base]
      sceneworks_revision:
        description: Exact lowercase SceneWorks commit paired with memory-evidence-v1
        type: string
        required: false
        default: ""
      migrate_mage_edit_variant_manifest:
        description: Migrate only the copied Mage edit-variant manifest after strict legacy verification (media only)
        type: boolean
        required: false
        default: false
      publish_chroma_artifacts:
        description: Publish validated Chroma q4/q8 artifacts (chroma-auxiliary profile only)
        type: boolean
        required: false
        default: false
      chroma_publish_confirmation:
        description: Type sc-16462 to authorize Chroma artifact publication
        type: string
        required: false
        default: ""
      chroma_model:
        description: Chroma model to validate; publication always requires all
        type: choice
        required: false
        default: all
        options: [all, chroma1_base, chroma1_hd, chroma1_flash]
      # sc-15520 — the memory ladder in dispatchable pieces, for the same reason `krea_s18_rows`
      # exists: `rw-chroma` shares nax-macos-2 with `rw-krea`, `rw-audio` and `rw-llm` one at a
      # time, and the whole 16-test ladder at the 28-step production schedule is multi-hour per
      # entry, so an indivisible run head-of-line-blocks the box for a night. `chroma_model`
      # already splits by entry; this splits within one.
      #
      # Space-separated test names, each validated against the ladder's own list before anything
      # runs — an unknown or renamed name is a HARD ERROR at dispatch rather than a filter that
      # quietly matches nothing. Empty (the default) is the whole ladder.
      chroma_ladder_tests:
        description: "Ladder tests (chroma-memory-ladder only): space-separated subset, empty = all 16"
        type: string
        required: false
        default: ""
      # The ladder measures `q4` (`DEFAULT_TIER`) for every asserted row; the other two tiers are
      # swept only by the per-cell coverage test, which reports absentees rather than demanding
      # them. Downloading all three roughly quadruples the transfer for evidence nothing asserts,
      # so widening this is opt-in.
      chroma_ladder_tiers:
        description: "Ladder tiers (chroma-memory-ladder only): space-separated subset of q4 q8 bf16"
        type: string
        required: false
        default: "q4"
      # sc-17655 — the S18 sweep in row-sized pieces. The whole seven-row sweep is ~4.3 h and
      # `rw-krea` shares nax-macos-2 with `rw-audio`, `rw-llm` and `rw-chroma` one at a time, so an
      # indivisible run head-of-line-blocks them for half a night (sc-16981). sc-17324 needed TWO
      # powered dispatches to learn this: run 30948568453 lost the runner outright 2h42m in, and its
      # replacement 30964561686 was cancelled by hand at 54m precisely because it was blocking the
      # box. One row is 3-53 min. The defaults are the full sweep, so an
      # operator who ignores these gets exactly the previous behaviour.
      #
      # A subset that is not the whole A/D/F dose ladder measures its cells and DELIBERATELY prints no
      # verdict — re-aggregate the uploaded `s18-cells.tsv` files afterwards with
      # `s18_verdict_from_accumulated_cells`, which applies the same rule to the assembled evidence.
      krea_s18_rows:
        description: "S18 sweep rows (krea-s18-sweep only): subset of ABCDFEZ, e.g. AD for one dispatch"
        type: string
        required: false
        # NOT ABCDFEZ — F and E do not fit on this lane's runner at the pinned 832x480, and the
        # preflight refuses them, so a default of all seven would be a default that always fails.
        # sc-17324, from measurement:
        #   * F (30-frame window, 46,800 tokens, ~49 GiB) killed nax-macos-2 twice. Run it at
        #     KREA_SMOKE_W=640 KREA_SMOKE_H=384, where it needs ~34 GiB — the bucket the recorded
        #     sc-15127 sweep already used for it.
        #   * E (global window, 70,200 tokens, ~63-69 GiB) is UNMEASURABLE on this infrastructure.
        #     It fit the 128 GiB dev Mac by 0.3 GiB and fills a boot volume with swap even at
        #     640x384 (sc-15571). It is a reference row the verdict rule explicitly refuses to use
        #     as attribution evidence, so nothing downstream depends on having it.
        default: ABCDZ
      krea_s18_seeds:
        description: "S18 sweep seeds (krea-s18-sweep only): comma-separated; 2+ for a between-seed spread"
        type: string
        required: false
        default: "7,11,23"
      # WxH as one input because `workflow_dispatch` is capped at 10 and this dispatcher already
      # carries 8. Needed because row F does not fit at the default 832x480 on this lane's runner
      # (~49 GiB, two dead runners) but does at 640x384 (~34 GiB) — without this the fallback bucket
      # is unreachable and row F is simply unrunnable, which is not the same thing as unmeasurable.
      # The optional `@q<bits>` suffix selects the sc-17807 KV cache tier. It rides this input for
      # the same reason WxH does: the dispatcher is already at the input cap, and a separate
      # `krea_s18_kv_bits` would push it over. Omitted = the shipped bf16 cache, so an unchanged
      # dispatch measures exactly what it measured before. A quantized dispatch is a SEPARATE arm —
      # its cells carry the tier in a 16th S18CELL field and the re-aggregator refuses to pool them
      # with the bf16 baseline.
      #
      # Group size is MLX's default 64 here and is not dispatchable: it would need a `/` in the
      # value, which is not a legal character in the artifact name this input now feeds. The Rust
      # knob (`KreaArConfig::kv_cache_quant`) still carries an arbitrary group size for a caller who
      # wants one; only this shorthand is fixed.
      krea_s18_geometry:
        description: "S18 sweep geometry (krea-s18-sweep only), WxH[@q<bits>] — 640x384 for row F, e.g. 640x384@q8"
        type: string
        required: false
        default: 832x480

permissions:
  contents: read

concurrency:
  group: inference-real-weights-${{ github.ref }}-${{ inputs.profile || 'schedule' }}
  cancel-in-progress: false

# BUILD ARTIFACTS OUTSIDE THE DIRECTORY `actions/checkout` CLEANS.
#
# `actions/checkout` defaults to `clean: true`, which is `git clean -ffdx` in the repo directory.
# `target/` is gitignored (.gitignore:79), so `-x` deletes it, and every job on a persistent box
# therefore paid a full cold build. Measured on `nax-macos` 2026-08-04: the whole of
# `target/debug/deps` carried a single job's timestamps (CACHEDIR.TAG 21:58, newest artifact
# 22:16) — 13 GB rebuilt from nothing, per job, on the scarcest hardware in the fleet.
#
# `github.workspace` is `_work/<repo>/<repo>`; its parent is the runner's per-repo work directory,
# which checkout does not touch and the runner does not recreate between jobs (only `_temp` is).
# So `../cargo-target` survives the clean while staying scoped per repo and per box. The `github`
# context is one of the three available to a workflow-level `env` (with `vars` and `inputs`) —
# `runner.workspace` would read better here but the `runner` context is step-level only, and a
# job-level twin would have to be repeated across all 37 jobs.
#
# Deliberately workflow-level, so the Windows CUDA real-weight jobs get the same treatment: the
# mechanism is `clean: true` plus a persistent runner, which is exactly their situation too.
# The two Chroma jobs keep their own `${{ runner.temp }}` target dirs — those are per-run by
# design (sc-16462 builds a tier from source and must not see a previous run's artifacts).
#
# Cargo keys artifacts by profile and features, so the weekly `--release` lane and any debug
# build coexist here rather than evicting each other. The cost is a persistent tens-of-GB
# directory per box; `nax-macos` was at 247 GiB free when this landed. If a box ever runs short,
# delete the directory — it is a cache, and the next job rebuilds it exactly as before.
#
# NB the `timeout-minutes` rationale on several jobs below still cites "the cold build that
# `clean: true` forces every week" as part of its sizing. Those budgets are now loose by that
# margin; re-sizing them from the first weekly run that executes with a warm target directory is
# sc-17057's scope, and they stay unchanged here rather than being guessed down (sc-16981).
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target

jobs:
  # SC-16462: build the complete packed Chroma tier from the exact currently-shipped bf16 source,
  # then prove progressive T5/VAE packed-vs-load-time identity, component quality, T5 residency,
  # and a coherent end-to-end render for base/HD/Flash at q4 and q8. Publication is a separate,
  # explicit mode of the same green lane; it fails closed on the expected current Hub revision and
  # runner-local HF auth.
  mlx-chroma-auxiliary:
    name: Chroma packed auxiliaries (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-auxiliary'
    runs-on: [self-hosted, macOS, ARM64, rw-chroma]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version
      - name: Validate publication authorization
        if: inputs.publish_chroma_artifacts && (inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model)
        run: |
          if [[ "${{ inputs.chroma_publish_confirmation }}" != "sc-16462" ]]; then
            echo "Publishing requires chroma_publish_confirmation=sc-16462" >&2
            exit 1
          fi
      - name: Materialize the exact shipped bf16 source
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$PYTHONPATH" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          python3.12 - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["CHROMA_REPOSITORY"],
              revision=os.environ["CHROMA_SOURCE_REVISION"],
              allow_patterns=["bf16/**", "q4/**", "q8/**"],
              local_dir=os.environ["CHROMA_SNAPSHOT"],
              token=False,
          )
          PY
          test -d "$CHROMA_SNAPSHOT/bf16/transformer"
          test -d "$CHROMA_SNAPSHOT/bf16/text_encoder"
          test -d "$CHROMA_SNAPSHOT/bf16/vae"
          test -d "$CHROMA_SNAPSHOT/q4/transformer"
          test -d "$CHROMA_SNAPSHOT/q8/transformer"
      - name: Build and validate packed q4/q8 tiers
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          SC16462_MODEL: ${{ matrix.model }}
          SC16462_OUT: ${{ runner.temp }}/chroma-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_PACKED_ROOT: ${{ runner.temp }}/chroma-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_PAYLOAD_MANIFEST: ${{ runner.temp }}/chroma-sc16462-payload-sha256.json
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-chroma-sc16462
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/chroma-sc16462-identity.jsonl"
          : > "$RUNNER_TEMP/chroma-sc16462-comparison.jsonl"
          for bits in 4 8; do
            # The shipped tier IS the baseline: it already carries the exact packed transformer plus
            # the dense bf16 auxiliaries. `repack_auxiliaries` derives the auxiliary width from that
            # transformer, so a tier can never be built whose text encoder sits above its own tier.
            export SC16462_BASELINE="$CHROMA_SNAPSHOT/q$bits"
            test -d "$SC16462_BASELINE/transformer"
            test -d "$SC16462_BASELINE/text_encoder"

            # Gate 1 — conversion faithfulness: the published pack must be BIT-identical to the
            # in-app load-time pack, or the shipped tier and a dense-source render diverge.
            cargo test --locked --release -p mlx-gen-chroma --test auxiliary_pack_identity \
              packed_auxiliaries_match_load_time_quantization -- --ignored --exact --nocapture \
              --test-threads=1 | tee "$RUNNER_TEMP/chroma-q$bits-identity.log"
            sed -n 's/^.*SC16462_IDENTITY //p' "$RUNNER_TEMP/chroma-q$bits-identity.log" \
              >> "$RUNNER_TEMP/chroma-sc16462-identity.jsonl"

            # Gate 2 — the shipped-vs-at-tier comparison: transformer bytes byte-identical, render
            # coherent (a missed packed site reads codes as floats and collapses), auxiliaries
            # actually smaller. Deliberately NO pixel-identity threshold against the bf16-auxiliary
            # render: packing the text encoder to the selected tier is supposed to move the
            # conditioning, and gating on identity would only pass by not doing the work.
            cargo test --locked --release -p mlx-gen-chroma --test auxiliary_tier_comparison \
              compare_auxiliary_widths -- --ignored --exact --nocapture --test-threads=1 \
              | tee "$RUNNER_TEMP/chroma-q$bits-comparison.log"
            sed -n 's/^.*auxiliaries @ //p' "$RUNNER_TEMP/chroma-q$bits-comparison.log" \
              >> "$RUNNER_TEMP/chroma-sc16462-comparison.jsonl"

            # Stage the tier that will actually be published, from the same derived-width path.
            rm -rf "$CHROMA_PACKED_ROOT/q$bits"
            mkdir -p "$CHROMA_PACKED_ROOT"
            cp -R "$SC16462_OUT/tier-aux-at-tier" "$CHROMA_PACKED_ROOT/q$bits"
            diff -qr -x text_encoder -x vae "$SC16462_BASELINE" "$CHROMA_PACKED_ROOT/q$bits"
          done
          test "$(wc -l < "$RUNNER_TEMP/chroma-sc16462-identity.jsonl" | tr -d ' ')" = 2
          python3.12 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHROMA_PACKED_ROOT"])
          files = {}
          t5_quantization = {}
          for tier in ("q4", "q8"):
              tier_root = root / tier
              expected_bits = int(tier[1:])
              quantization = json.loads(
                  (tier_root / "text_encoder/config.json").read_text(encoding="utf-8")
              )["quantization"]
              t5_quantization[tier] = quantization
              # The invariant this whole story exists to restore: the auxiliaries sit AT the tier the
              # user selected, never above it.
              if quantization.get("bits") != expected_bits:
                  raise SystemExit(
                      f"{tier}: text encoder declares Q{quantization.get('bits')}, expected "
                      f"Q{expected_bits} -- an auxiliary above the selected tier is the defect"
                  )
              if quantization.get("group_size") != 32:
                  raise SystemExit(f"{tier}: T5 group_size {quantization.get('group_size')} != 32")
              if "residual_bits" in quantization:
                  raise SystemExit(f"{tier}: residual packing was removed; artifact is stale")
              for path in sorted(tier_root.rglob("*")):
                  if path.is_file() and ".cache" not in path.parts:
                      digest = hashlib.sha256()
                      with path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      relative = f"{tier}/{path.relative_to(tier_root).as_posix()}"
                      files[relative] = {
                          "size": path.stat().st_size,
                          "sha256": digest.hexdigest(),
                      }
          manifest = {
              "model": os.environ["CHROMA_MODEL"],
              "inferenceRevision": os.environ["GITHUB_SHA"],
              "sourceRevision": os.environ["CHROMA_SOURCE_REVISION"],
              "t5Quantization": t5_quantization,
              "files": files,
          }
          Path(os.environ["CHROMA_PAYLOAD_MANIFEST"]).write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload Chroma calibration evidence
        if: always() && (inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-sc16462-${{ matrix.model }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chroma-sc16462-identity.jsonl
            ${{ runner.temp }}/chroma-sc16462-comparison.jsonl
            ${{ runner.temp }}/chroma-sc16462-payload-sha256.json

  # Publication cannot begin until every Base/HD/Flash validation leg above is green. Each repo
  # receives q4+q8 in one parent-guarded commit. A retry explicitly verifies an already-published
  # repo byte-for-byte and treats it as success, making a cross-repository partial run resumable.
  mlx-chroma-publish:
    name: Publish Chroma packed auxiliaries (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-auxiliary' && inputs.publish_chroma_artifacts && inputs.chroma_model == 'all'
    needs: mlx-chroma-auxiliary
    runs-on: [self-hosted, macOS, ARM64, rw-chroma]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate publication authorization
        run: |
          if [[ "${{ inputs.chroma_publish_confirmation }}" != "sc-16462" ]]; then
            echo "Publishing requires chroma_publish_confirmation=sc-16462" >&2
            exit 1
          fi
      - name: Download the validated payload manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chroma-sc16462-${{ matrix.model }}
          path: ${{ runner.temp }}/chroma-sc16462-validated-${{ matrix.model }}
      - name: Rebuild the validated payload from the immutable source
        env:
          CHROMA_SNAPSHOT: ${{ runner.temp }}/chroma-publish-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_BUILT: ${{ runner.temp }}/chroma-publish-built-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_PACKED: ${{ runner.temp }}/chroma-publish-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          CHROMA_VALIDATED_MANIFEST: ${{ runner.temp }}/chroma-sc16462-validated-${{ matrix.model }}/chroma-sc16462-payload-sha256.json
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-chroma-sc16462-publish
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
        run: |
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$PYTHONPATH" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          python3.12 - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["CHROMA_REPOSITORY"],
              revision=os.environ["CHROMA_SOURCE_REVISION"],
              allow_patterns=["bf16/**", "q4/**", "q8/**"],
              local_dir=os.environ["CHROMA_SNAPSHOT"],
              token=False,
          )
          PY
          mkdir -p "$CHROMA_PACKED"
          for bits in 4 8; do
            # `repack_auxiliaries` copies transformer/tokenizer/scheduler/top-level bytes verbatim and
            # rewrites ONLY text_encoder/ + vae/, at the width it derives from the tier's own packed
            # transformer. The publish path therefore cannot move transformer bytes, and cannot mint
            # an auxiliary above the tier the user selected. The `diff` below re-proves the first
            # property independently of the Rust code that promised it.
            SC16462_BASELINE="$CHROMA_SNAPSHOT/q$bits" \
            SC16462_OUT="$CHROMA_BUILT/q$bits" \
            SC16462_MODEL="$CHROMA_MODEL" \
              cargo test --locked --release -p mlx-gen-chroma --test auxiliary_pack_identity \
                packed_auxiliaries_match_load_time_quantization -- --ignored --exact --nocapture \
                --test-threads=1
            cp -R "$CHROMA_BUILT/q$bits/identity-q$bits" "$CHROMA_PACKED/q$bits"
            diff -qr -x text_encoder -x vae "$CHROMA_SNAPSHOT/q$bits" "$CHROMA_PACKED/q$bits"
          done
          python3.12 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHROMA_PACKED"])
          expected = json.loads(Path(os.environ["CHROMA_VALIDATED_MANIFEST"]).read_text())
          # Each tier's auxiliaries must declare that tier's own width. q4 and q8 therefore DIFFER
          # here by construction: equal policies across tiers is precisely the above-tier defect
          # sc-16462 removes (the old lane asserted they were equal, which is how a uniform Q8
          # auxiliary rode along on the q4 route).
          t5_quantization = {}
          for tier in ("q4", "q8"):
              quantization = json.loads(
                  (root / tier / "text_encoder/config.json").read_text(encoding="utf-8")
              )["quantization"]
              expected_bits = int(tier[1:])
              if quantization.get("bits") != expected_bits:
                  raise SystemExit(
                      f"{tier}: rebuilt text encoder declares Q{quantization.get('bits')}, expected "
                      f"Q{expected_bits} -- an auxiliary above the selected tier is the defect"
                  )
              if quantization.get("group_size") != 32:
                  raise SystemExit(f"{tier}: T5 group_size {quantization.get('group_size')} != 32")
              if "residual_bits" in quantization:
                  raise SystemExit(f"{tier}: residual packing was removed; artifact is stale")
              t5_quantization[tier] = quantization
          identity = {
              "model": os.environ["CHROMA_MODEL"],
              "inferenceRevision": os.environ["GITHUB_SHA"],
              "sourceRevision": os.environ["CHROMA_SOURCE_REVISION"],
              "t5Quantization": t5_quantization,
          }
          for key, value in identity.items():
              if expected.get(key) != value:
                  raise SystemExit(
                      f"validated payload {key} mismatch: {expected.get(key)!r} != {value!r}"
                  )
          files = {}
          for tier in ("q4", "q8"):
              tier_root = root / tier
              for path in sorted(tier_root.rglob("*")):
                  if path.is_file() and ".cache" not in path.parts:
                      digest = hashlib.sha256()
                      with path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      relative = f"{tier}/{path.relative_to(tier_root).as_posix()}"
                      files[relative] = {
                          "size": path.stat().st_size,
                          "sha256": digest.hexdigest(),
                      }
          if files != expected.get("files"):
              missing = sorted(set(expected.get("files", {})) - set(files))
              extra = sorted(set(files) - set(expected.get("files", {})))
              changed = sorted(
                  key
                  for key in set(files) & set(expected.get("files", {}))
                  if files[key] != expected["files"][key]
              )
              raise SystemExit(
                  f"rebuilt payload differs from validation: missing={missing}, extra={extra}, changed={changed}"
              )
          print(f"verified {len(files)} rebuilt files against validation SHA-256 manifest")
          PY
      - name: Publish or verify the complete q4/q8 replacement
        env:
          CHROMA_PACKED: ${{ runner.temp }}/chroma-publish-packed-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          CHROMA_REPORT: ${{ runner.temp }}/chroma-sc16462-artifact-${{ matrix.model }}.json
        run: |
          python3.12 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import (
              CommitOperationAdd,
              CommitOperationDelete,
              HfApi,
              hf_hub_download,
          )

          api = HfApi()
          identity = api.whoami()
          if not identity.get("name"):
              raise SystemExit("authenticated Hugging Face identity is required for publication")

          repository = os.environ["CHROMA_REPOSITORY"]
          expected = os.environ["CHROMA_SOURCE_REVISION"]
          expected_model = api.model_info(repository, revision=expected, files_metadata=True)
          current = api.model_info(repository).sha
          current_model = api.model_info(repository, revision=current, files_metadata=True)
          packed_root = Path(os.environ["CHROMA_PACKED"])
          additions = {}
          for tier in ("q4", "q8"):
              tier_root = packed_root / tier
              for path in tier_root.rglob("*"):
                  if path.is_file() and ".cache" not in path.parts:
                      additions[f"{tier}/{path.relative_to(tier_root).as_posix()}"] = path

          def lfs_sha(sibling):
              lfs = getattr(sibling, "lfs", None)
              if lfs is None:
                  return None
              return getattr(lfs, "sha256", None) or (
                  lfs.get("sha256") if isinstance(lfs, dict) else None
              )

          def remote_signature(model, prefix):
              return {
                  sibling.rfilename: (
                      sibling.size,
                      lfs_sha(sibling),
                      getattr(sibling, "blob_id", None),
                  )
                  for sibling in model.siblings
                  if sibling.rfilename.startswith(prefix)
              }

          if remote_signature(current_model, "bf16/") != remote_signature(expected_model, "bf16/"):
              raise SystemExit(f"{repository} bf16 tree moved from immutable source; refusing")

          def published_payload_matches(model):
              siblings = {
                  sibling.rfilename: sibling
                  for sibling in model.siblings
                  if sibling.rfilename.startswith(("q4/", "q8/"))
              }
              if siblings.keys() != additions.keys():
                  return False
              for remote_path, local_path in additions.items():
                  sibling = siblings[remote_path]
                  if sibling.size != local_path.stat().st_size:
                      return False
                  remote_sha = lfs_sha(sibling)
                  if remote_sha:
                      digest = hashlib.sha256()
                      with local_path.open("rb") as handle:
                          for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      if digest.hexdigest() != remote_sha:
                          return False
                  else:
                      downloaded = Path(hf_hub_download(
                          repo_id=repository,
                          filename=remote_path,
                          revision=model.sha,
                      ))
                      if downloaded.read_bytes() != local_path.read_bytes():
                          return False
              return True

          idempotent = current != expected
          if idempotent:
              if not published_payload_matches(current_model):
                  raise SystemExit(
                      f"{repository} main moved to {current} but is not the verified SC-16462 payload"
                  )
              commit_url = f"https://huggingface.co/{repository}/commit/{current}"
          else:
              existing_paths = {
                  sibling.rfilename
                  for sibling in current_model.siblings
                  if sibling.rfilename.startswith(("q4/", "q8/"))
              }
              operations = [
                  CommitOperationDelete(path_in_repo=path)
                  for path in sorted(existing_paths - additions.keys())
              ]
              operations.extend(
                  CommitOperationAdd(path_in_repo=path, path_or_fileobj=local_path)
                  for path, local_path in sorted(additions.items())
              )
              info = api.create_commit(
                  repo_id=repository,
                  operations=operations,
                  commit_message="sc-16462: publish complete packed q4/q8 tiers",
                  parent_commit=current,
              )
              current = info.oid
              commit_url = str(info.commit_url)
              current_model = api.model_info(repository, revision=current, files_metadata=True)
              if not published_payload_matches(current_model):
                  raise SystemExit(f"{repository}@{current} failed post-publish verification")

          sizes = {
              tier: sum(
                  sibling.size or 0
                  for sibling in current_model.siblings
                  if sibling.rfilename.startswith(f"{tier}/")
              )
              for tier in ("q4", "q8", "bf16")
          }
          report = {
              "repository": repository,
              "sourceRevision": expected,
              "resolvedRevision": current,
              "sizes": sizes,
              "commit": {"oid": current, "url": commit_url},
              "publishedBy": identity["name"],
              "idempotentVerification": idempotent,
          }
          Path(os.environ["CHROMA_REPORT"]).write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY
      - name: Upload immutable artifact report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-sc16462-artifact-${{ matrix.model }}
          if-no-files-found: error
          path: ${{ runner.temp }}/chroma-sc16462-artifact-${{ matrix.model }}.json

  # SC-15520: the Chroma1 memory ladder on real weights.
  #
  # WHY THIS EXISTS. Every number the ladder publishes — the rung peaks, the rung-2 drift verdict,
  # the rung-4 attribution — was measured by hand on a developer Mac and verifiable nowhere else:
  # `CHROMA_LADDER_*` appeared in no workflow, so nothing in CI ever executed these 16 tests. That
  # is not a coverage gap in the abstract. Four separate instrument defects reached `main` through
  # it, and the fourth was a live mutation (`measure()` scaled every peak by `1 + steps/100`) that
  # survived a push and a merge because no lane would have run the test it reddened. A measured
  # claim that CI cannot re-take is a claim nobody can check.
  #
  # MANUAL DISPATCH IS THE POINT, not a limitation. This is hours of Metal time on a shared box;
  # it should be runnable and discoverable on demand, not on every push.
  #
  # SPLITTING. Two axes, both already the house pattern. `chroma_model` picks the entry (the
  # matrix leg, exactly as `chroma-auxiliary` does) and `chroma_ladder_tests` picks tests within
  # one. The entry axis is the intended default split and the matrix runs `max-parallel: 1` —
  # three legs of one entry each, never one leg of three.
  #
  # MEASURED, not estimated (chroma1_base q4 1024², 2026-08-06, this machine). All 16 tests for ONE
  # entry are ~2.96 h, which fits the 360-minute timeout with roughly 2x margin:
  #
  #   identical_requests_reproduce_once_the_allocator_has_settled   44m 06s   <- 8 x 28-step renders
  #   transformer_window_sweep_and_streamed_output_identity         24m 27s
  #   the_window_component_scopes_are_measured_not_inherited        19m 51s
  #   the_rung_two_drift_margin_is_resampled_across_seeds           26m 27s   <- 5 x 28-step renders
  #   decode_tile_mechanism_sweep_on_the_production_latent          ~17m
  #   the_full_ladder_renders_under_a_memory_cap                    13m 58s
  #   the_rung_four_saving_is_inside_the_block_weight_set           10m 03s
  #   staged_residency_bounds_the_request_peak_and_preserves_output  9m 21s
  #   the_request_peak_is_step_independent                           5m 12s
  #   attention_chunking_is_measured_at_the_dit_seam                ~4m
  #   every_cached_entry_and_tier_publishes_its_own_evidence          2m 18s
  #   the six refusal / domain / precondition / phase tests          < 20s each
  #
  # So one ENTRY fits one job, but `chroma_model: all` is ~9 h of wall clock on a box three other
  # lanes queue behind. Dispatch one entry at a time unless a night is genuinely free, and reach
  # for `chroma_ladder_tests` when only part of the ladder is in question — the top four rows are
  # 80% of the cost.
  #
  # EVERY test is named and run with `--exact`, and each is required to report exactly one passing
  # test. A filter that matches nothing makes libtest print "0 passed" and cargo exit 0, which is
  # the silent green this lane exists to prevent — the same guard the qwen-image and krea lanes use.
  mlx-chroma-memory-ladder:
    name: Chroma memory ladder (${{ matrix.model }})
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'chroma-memory-ladder'
    runs-on: [self-hosted, macOS, ARM64, rw-chroma]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # One entry at a time: `rw-chroma` is a single box shared with three other lanes, and two
      # concurrent Metal workloads on one device is the documented SIGSEGV.
      max-parallel: 1
      matrix:
        include:
          - model: chroma1_base
            repository: SceneWorks/chroma1-base-mlx
            source_revision: e7330dda29d00ffdeeb719b28e92ee74cff0884c
          - model: chroma1_hd
            repository: SceneWorks/chroma1-hd-mlx
            source_revision: 9d99afe1ebca67032476756bc70d4a7152bc1bd5
          - model: chroma1_flash
            repository: SceneWorks/chroma1-flash-mlx
            source_revision: 6a9cb6178709559461506bf247f708d0d1008d00
    env:
      CHROMA_MODEL: ${{ matrix.model }}
      CHROMA_REPOSITORY: ${{ matrix.repository }}
      CHROMA_SOURCE_REVISION: ${{ matrix.source_revision }}
      CHROMA_LADDER_TESTS: ${{ inputs.chroma_ladder_tests }}
      CHROMA_LADDER_TIERS: ${{ inputs.chroma_ladder_tiers }}
      # The harness resolves the entry under test through this; `representative()` panics on any
      # value outside the three catalog entries, so a matrix typo fails rather than silently
      # measuring base three times.
      CHROMA_LADDER_ENTRY: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3.12 --version
      # No `report_runner_disk_headroom.sh` step here, deliberately. That script reports on the
      # `~/`-relative snapshot VARIABLES a lane resolves through `resolve_snapshot_paths.py`, and
      # this lane resolves none: like `chroma-auxiliary`, `rw-chroma` stores no Chroma bytes and
      # materializes into `runner.temp` from the Hub per run. Reporting headroom without a
      # resolved path is what `test_every_resolving_lane_reports_what_it_costs` forbids.
      #
      # Validate the dispatch inputs BEFORE the download, so a typo costs seconds rather than a
      # 14 GiB transfer and a runner-hour. Both lists are checked against the real names.
      - name: Validate ladder dispatch inputs
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        run: |
          set -euo pipefail
          # The ladder's tests are exactly the `#[ignore]`d ones; helpers are not dispatchable.
          all_tests="$(python3.12 - <<'PY'
          import re, pathlib
          src = pathlib.Path("crates/media/mlx-gen/mlx-gen-chroma/tests/memory_ladder_real_weights.rs").read_text()
          names = re.findall(r'#\[test\]\s*\n\s*#\[ignore[^\]]*\]\s*\nfn ([a-z0-9_]+)\(', src)
          print("\n".join(names))
          PY
          )"
          n_all="$(grep -c . <<<"$all_tests")"
          if [[ "$n_all" -ne 16 ]]; then
            echo "::error::expected 16 ignored ladder tests, found $n_all — the list this lane dispatches has drifted from the file" >&2
            exit 1
          fi
          for t in $CHROMA_LADDER_TESTS; do
            if ! grep -qxF "$t" <<<"$all_tests"; then
              echo "::error::chroma_ladder_tests names '$t', which is not a test in memory_ladder_real_weights.rs" >&2
              exit 1
            fi
          done
          for tier in $CHROMA_LADDER_TIERS; do
            case "$tier" in
              q4|q8|bf16) ;;
              *) echo "::error::chroma_ladder_tiers names '$tier'; valid tiers are q4 q8 bf16" >&2; exit 1 ;;
            esac
          done
          if ! tr ' ' '\n' <<<"$CHROMA_LADDER_TIERS" | grep -qx q4; then
            echo "::error::chroma_ladder_tiers must include q4 — DEFAULT_TIER is what every asserted row measures" >&2
            exit 1
          fi
          { echo "CHROMA_LADDER_ALL_TESTS<<EOF"; echo "$all_tests"; echo "EOF"; } >> "$GITHUB_ENV"
      - name: Materialize the pinned Chroma snapshot
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        env:
          PYTHONPATH: ${{ runner.temp }}/huggingface-hub
          # Step-level, not job-level: `runner.temp` in a job `env:` block is refused by
          # `test_mage_media_lane_requires_verified_operator_cpu_oracles`.
          CHROMA_LADDER_ROOT: ${{ runner.temp }}/chroma-ladder-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.model }}
        run: |
          set -euo pipefail
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$PYTHONPATH" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          python3.12 - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          tiers = os.environ["CHROMA_LADDER_TIERS"].split()
          snapshot_download(
              repo_id=os.environ["CHROMA_REPOSITORY"],
              revision=os.environ["CHROMA_SOURCE_REVISION"],
              allow_patterns=[f"{tier}/**" for tier in tiers],
              local_dir=os.environ["CHROMA_LADDER_ROOT"],
              token=False,
          )
          PY
          # The harness takes a snapshot ROOT and joins the tier itself, so assert the layout it
          # expects rather than discovering a `SKIPPED-BY-ABSENCE` panic hours into the ladder.
          for tier in $CHROMA_LADDER_TIERS; do
            test -d "$CHROMA_LADDER_ROOT/$tier/transformer"
            test -d "$CHROMA_LADDER_ROOT/$tier/text_encoder"
            test -d "$CHROMA_LADDER_ROOT/$tier/vae"
          done
          # The harness takes ONE env var per catalog entry. Only this leg's entry is
          # materialized, so the other two stay unset and the per-cell coverage test reports them
          # as absent rather than measuring them — its documented contract, not a gap. Exported
          # here rather than as a job `env:` ternary so the path expression exists once.
          case "$CHROMA_MODEL" in
            chroma1_base)  entry_var=CHROMA_LADDER_BASE ;;
            chroma1_hd)    entry_var=CHROMA_LADDER_HD ;;
            chroma1_flash) entry_var=CHROMA_LADDER_FLASH ;;
            *) echo "::error::unknown Chroma entry '$CHROMA_MODEL'" >&2; exit 1 ;;
          esac
          echo "$entry_var=$CHROMA_LADDER_ROOT" >> "$GITHUB_ENV"
      - name: Run the memory ladder
        if: inputs.chroma_model == 'all' || inputs.chroma_model == matrix.model
        run: |
          set -euo pipefail
          tests="$CHROMA_LADDER_TESTS"
          if [[ -z "${tests// }" ]]; then
            tests="$CHROMA_LADDER_ALL_TESTS"
          fi
          ran=0
          for name in $tests; do
            echo "::group::$name"
            # `--exact` AFTER `--`: it is a libtest flag, and libtest is also what consumes
            # `--ignored`. The filter itself is cargo's positional test-name argument.
            out="$(cargo test --locked --release -p mlx-gen-chroma \
              --test memory_ladder_real_weights \
              "$name" -- --exact --ignored --test-threads=1 --nocapture 2>&1 \
              | tee "$RUNNER_TEMP/chroma-ladder-$name.log" /dev/stderr)"
            echo "::endgroup::"
            # A rename, a typo, or a lost `#[ignore]` all produce "0 passed" and exit 0. This is
            # the guard that makes the lane's green mean something (sc-15520 review round 2).
            if ! grep -qE "test result: ok\. 1 passed" <<<"$out"; then
              echo "::error::'$name' did not run exactly one passing test — a rename or a filter typo would make this step vacuously green" >&2
              exit 1
            fi
            ran=$((ran + 1))
          done
          echo "ran $ran ladder test(s) for $CHROMA_MODEL"
          if [[ "$ran" -eq 0 ]]; then
            echo "::error::the ladder ran no tests at all" >&2
            exit 1
          fi
      - name: Upload ladder measurement logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chroma-memory-ladder-${{ matrix.model }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/chroma-ladder-*.log

  # SC-15507: a narrow, independently dispatchable acceptance lane for the request-scoped
  # MLX lifecycle. The broader `media` profile also runs this test, but it requires the complete
  # frozen-Torch Mage oracle bundle before reaching it. This lane intentionally needs only the
  # immutable Mage snapshot consumed by the lifecycle test itself, so an unrelated oracle-cache
  # miss cannot suppress the real-Apple seam gate.
  mlx-request-memory-scope:
    name: MLX request-memory scope real weights
    if: inputs.profile == 'request-memory-scope'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 120
    env:
      MAGE_REQUEST_SCOPE_SNAPSHOT: ${{ vars.MAGE_SNAPSHOT }}
      MAGE_REQUEST_SCOPE_QUANT: bf16
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          MAGE_REQUEST_SCOPE_SNAPSHOT
      - name: Toolchain versions
        run: rustc --version && cargo --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          MAGE_REQUEST_SCOPE_SNAPSHOT
      - name: Materialize and verify immutable Mage snapshot
        run: |
          if [[ -z "$MAGE_REQUEST_SCOPE_SNAPSHOT" || "$MAGE_REQUEST_SCOPE_SNAPSHOT" != /* ]]; then
            echo "MAGE_SNAPSHOT must be an operator-provided absolute path" >&2
            exit 1
          fi
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py \
            --model mage-flow \
            --snapshot "$MAGE_REQUEST_SCOPE_SNAPSHOT"
      - name: Run Mage request-memory lifecycle
        run: >-
          cargo test --locked --release -p mlx-gen-mage
          --test request_memory_scope_real_weights -- --ignored --nocapture

  # sc-18249: the SANA tiled-decode drift ceiling (`DECODE_TILING_MEAN_ABS_U8 = 6.0`) was enforced
  # only by `#[ignore]` real-weight tests no workflow referenced — the exact sc-17250 shape: a
  # pinned snapshot holding runner disk while the gates it backs ran nowhere. This lane runs the
  # two ceiling-bearing tests. Unlike the Z-Image `mlx-memory-evidence-v1` lane below there is NO
  # out-of-band verifier
  # (`verify_residency_ab.py` re-derives z-image's drift from bound artifacts; no SANA equivalent
  # exists): the ceiling is asserted INSIDE the tests, so the job's contract is `set -o pipefail`
  # plus the test exit code, and the artifacts (full log, model inventory, PPM renders + 8x
  # amplified diffs from `SANA_SWEEP_OUT`) are the reviewable evidence rather than a verdict file.
  # Operator-dispatched, not scheduled: base SANA runs its true 20-step CFG schedule (40 trunk
  # forwards per 1024² render) and the two tests render ~27 images with a fresh model load per
  # measured row, which is hours on `rw-mage` hardware — the sc-16981 head-of-line shape.
  mlx-sana-drift-ceiling:
    name: MLX SANA drift ceiling real weights
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'sana-drift-ceiling'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 360
    env:
      SANA_LADDER_1600M: ${{ vars.SANA_LADDER_1600M }}
      INFERENCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          SANA_LADDER_1600M
      - name: Verify exact clean inference provenance
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3.12 --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          SANA_LADDER_1600M
      - name: Materialize and verify immutable SANA snapshot
        env:
          SANA_MODEL_INVENTORY: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory.json
        run: |
          if [[ -z "$SANA_LADDER_1600M" || "$SANA_LADDER_1600M" != /* ]]; then
            echo "SANA_LADDER_1600M must be an operator-provided absolute path" >&2
            exit 1
          fi
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py \
            --model sana-1600m-mlx \
            --snapshot "$SANA_LADDER_1600M"
          python3.12 scripts/release/verify_model_snapshot.py \
            --model sana-1600m-mlx \
            --snapshot "$SANA_LADDER_1600M" \
            --inventory-output "$SANA_MODEL_INVENTORY"
      - name: Run the ceiling-bearing drift tests
        env:
          SANA_DRIFT_OUTPUT_DIR: ${{ runner.temp }}/sana-drift-ceiling
          SANA_DRIFT_LOG: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-drift.log
          # The sweep dumps every render and its 8x-amplified diff here — the sc-17863 "verdict
          # with eyes on the renders" evidence, preserved per run instead of living on one dev Mac.
          SANA_SWEEP_OUT: ${{ runner.temp }}/sana-drift-ceiling/renders
          SANA_MODEL_INVENTORY: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory.json
          SANA_MODEL_INVENTORY_AFTER: ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory-after.json
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$SANA_DRIFT_OUTPUT_DIR"
          set -o pipefail
          # Two tests, run `--exact` so a rename cannot silently widen or empty the filter:
          # the five-latent resample that owns the 6.0 ceiling, then the published-domain sweep
          # that bounds every published edge, pins the drift/peak monotonicity, and records the
          # out-of-domain overlap refusals (an admitted probe row asserts the same ceiling).
          #
          # Each invocation must prove it ran EXACTLY ONE passing test. A rename, a filter typo,
          # or a lost `#[ignore]` all produce "0 passed" and exit 0 — a lane that is fully green
          # while enforcing nothing (the sc-15520 review-round-2 guard the sibling ladder lanes
          # carry). Per invocation rather than aggregate, so one invocation matching two tests
          # can never cover for the other matching none.
          out="$(cargo test --locked --release -p mlx-gen-sana \
            --test memory_ladder_real_weights \
            the_tiled_decode_drift_is_resampled_across_production_latents -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee "$SANA_DRIFT_LOG" /dev/stderr)"
          if ! grep -qE "test result: ok\. 1 passed" <<<"$out"; then
            echo "::error::the resample test did not run exactly one passing test — a rename or a filter typo would make this step vacuously green" >&2
            exit 1
          fi
          out="$(cargo test --locked --release -p mlx-gen-sana \
            --test memory_ladder_real_weights \
            the_published_decode_tile_domain_is_swept_against_the_whole_image_decode -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee -a "$SANA_DRIFT_LOG" /dev/stderr)"
          if ! grep -qE "test result: ok\. 1 passed" <<<"$out"; then
            echo "::error::the domain sweep did not run exactly one passing test — a rename or a filter typo would make this step vacuously green" >&2
            exit 1
          fi
          python3.12 scripts/release/verify_model_snapshot.py \
            --model sana-1600m-mlx \
            --snapshot "$SANA_LADDER_1600M" \
            --inventory-output "$SANA_MODEL_INVENTORY_AFTER"
          if ! cmp -s "$SANA_MODEL_INVENTORY" "$SANA_MODEL_INVENTORY_AFTER"; then
            echo "SANA snapshot content changed during the drift run" >&2
            exit 1
          fi
      - name: Upload drift log, inventory, and render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sana-drift-ceiling-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-drift.log
            ${{ runner.temp }}/sana-drift-ceiling/sana-1600m-mlx-model-inventory.json
            ${{ runner.temp }}/sana-drift-ceiling/renders

  mlx-memory-evidence-v1:
    name: MLX memory evidence V1 real weights
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'memory-evidence-v1'
    runs-on: [self-hosted, macOS, ARM64, rw-mage]
    timeout-minutes: 180
    env:
      ZIMAGE_SNAPSHOT: ${{ vars.ZIMAGE_SNAPSHOT }}
      # sc-18149: no ZIMAGE_SEQ_SIZE override. The lane used to pin 512, where the Sequential
      # route's forced tiled decode degenerates to a single tile and reproduces the whole-image
      # decode byte-for-byte (measured drift exactly 0) — which kept Exact green at the cell while
      # the shipping 768²+ configuration drifted uncharacterized. The A/B now runs the test's 768²
      # default, where tiling actually engages, under the declared drift tolerance; the in-test
      # isolator leg (Resident + forced tiled decode) still pins residency staging itself to
      # byte-exactness on every run.
      INFERENCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Repository variables hold ONE value for every runner in a label pool, but the two
      # macOS boxes do not share a home directory. A `~/`-relative value is resolved here
      # against the home of whichever runner actually claimed this job; absolute values
      # pass through untouched, so variables can be flipped one at a time.
      - name: Resolve runner-local snapshot paths
        run: >-
          python3.12 scripts/release/resolve_snapshot_paths.py
          ZIMAGE_SNAPSHOT
      - name: Verify exact clean inference provenance
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Resolve and bind exact SceneWorks provenance outside the inference worktree
        env:
          SCENEWORKS_PROVENANCE_ROOT: ${{ runner.temp }}/sceneworks-provenance
        run: |
          git init "$SCENEWORKS_PROVENANCE_ROOT"
          git -C "$SCENEWORKS_PROVENANCE_ROOT" remote add origin https://github.com/SceneWorks/SceneWorks.git
          git -C "$SCENEWORKS_PROVENANCE_ROOT" fetch --depth=1 origin "${{ inputs.sceneworks_revision }}"
          git -C "$SCENEWORKS_PROVENANCE_ROOT" checkout --detach FETCH_HEAD
          resolved="$(git -C "$SCENEWORKS_PROVENANCE_ROOT" rev-parse HEAD)"
          if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ || "$resolved" != "${{ inputs.sceneworks_revision }}" ]]; then
            echo "sceneworks_revision did not resolve to the exact requested commit" >&2
            exit 1
          fi
          test -z "$(git -C "$SCENEWORKS_PROVENANCE_ROOT" status --porcelain --untracked-files=normal)"
          echo "SCENEWORKS_REVISION=$resolved" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3.12 --version
      # Report-only: what this box had free, and which of these snapshots it already holds,
      # BEFORE anything transfers. Also names the runner -- `rw-*` labels live in org settings
      # and are invisible from the runners themselves, so a run log is the only record of
      # which of the two Macs actually took a lane. Never fails the job; see the script.
      - name: Report runner disk headroom
        # The script exits 0 on every path, but the STEP can still fail for reasons it never
        # sees -- a lost exec bit, a wrong working directory. A step that only produces a
        # record must not be able to kill a multi-hour real-weight lane.
        continue-on-error: true
        run: >-
          scripts/ci/report_runner_disk_headroom.sh
          ZIMAGE_SNAPSHOT
      - name: Materialize and verify immutable Z-Image snapshot
        env:
          MEMORY_MODEL_INVENTORY: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
        run: |
          if [[ -z "$ZIMAGE_SNAPSHOT" || "$ZIMAGE_SNAPSHOT" != /* ]]; then
            echo "ZIMAGE_SNAPSHOT must be an operator-provided absolute path" >&2
            exit 1
          fi
          python3.12 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/huggingface-hub" -r .github/requirements/real-weights-huggingface-hub-macos-arm64-py312.txt
          PYTHONPATH="$RUNNER_TEMP/huggingface-hub" python3.12 scripts/release/ensure_model_snapshot.py \
            --model z-image-turbo \
            --snapshot "$ZIMAGE_SNAPSHOT"
          python3.12 scripts/release/verify_model_snapshot.py \
            --model z-image-turbo \
            --snapshot "$ZIMAGE_SNAPSHOT" \
            --inventory-output "$MEMORY_MODEL_INVENTORY"
          inventory_sha="$(python3.12 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["inventory_sha256"])' "$MEMORY_MODEL_INVENTORY")"
          model_revision="$(python3.12 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["revision"])' "$MEMORY_MODEL_INVENTORY")"
          if [[ ! "$inventory_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "model inventory did not produce an exact SHA-256" >&2
            exit 1
          fi
          if [[ ! "$model_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "model inventory did not bind an exact revision" >&2
            exit 1
          fi
          echo "MEMORY_MODEL_INVENTORY_SHA256=$inventory_sha" >> "$GITHUB_ENV"
          echo "MEMORY_MODEL_REVISION=$model_revision" >> "$GITHUB_ENV"
      - name: Run and verify Z-Image resident versus staged evidence
        env:
          MEMORY_EVIDENCE_OUTPUT_DIR: ${{ runner.temp }}/memory-evidence-v1
          MEMORY_EVIDENCE_LOG: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo.log
          MEMORY_MODEL_INVENTORY: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
          MEMORY_MODEL_INVENTORY_AFTER: ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory-after.json
        run: |
          test "$(git rev-parse HEAD)" = "$INFERENCE_REVISION"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$MEMORY_EVIDENCE_OUTPUT_DIR"
          set -o pipefail
          cargo test --locked --release -p mlx-gen-z-image \
            --test sequential_residency_real_weights \
            sequential_bounds_peak_within_declared_decode_drift -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee "$MEMORY_EVIDENCE_LOG"
          python3.12 scripts/release/verify_model_snapshot.py \
            --model z-image-turbo \
            --snapshot "$ZIMAGE_SNAPSHOT" \
            --inventory-output "$MEMORY_MODEL_INVENTORY_AFTER"
          if ! cmp -s "$MEMORY_MODEL_INVENTORY" "$MEMORY_MODEL_INVENTORY_AFTER"; then
            echo "Z-Image snapshot content changed during the evidence run" >&2
            exit 1
          fi
          # sc-18149: the Sequential route's forced tiled decode (sc-13571) makes Exact parity
          # structurally unsatisfiable for this A/B; the adjudicated contract is the measured
          # mean-abs drift ceiling (+ p99 tail pin) the lane declares here, re-derived by the
          # verifier from the bound artifacts rather than trusted from the harness. The isolator
          # artifact (Resident + forced tiled decode) must be byte-identical to the staged output,
          # which pins residency staging itself to exactness independently of the harness.
          python3.12 scripts/release/verify_residency_ab.py \
            --model z_image_turbo \
            --resident "$MEMORY_EVIDENCE_LOG" \
            --sequential "$MEMORY_EVIDENCE_LOG" \
            --min-reduction-mib 512 \
            --expected-fingerprint z-image-mlx-independent-materialization-v3 \
            --expected-abi 3 \
            --expected-model-revision "$MEMORY_MODEL_REVISION" \
            --expected-model-inventory-sha256 "$MEMORY_MODEL_INVENTORY_SHA256" \
            --expected-parity tolerance:mean_abs_u8_subpixel:4.0 \
            --max-p99-abs-u8 13 \
            --resident-output "$MEMORY_EVIDENCE_OUTPUT_DIR/z_image_turbo-resident.rgb" \
            --sequential-output "$MEMORY_EVIDENCE_OUTPUT_DIR/z_image_turbo-staged.rgb" \
            --isolator-output "$MEMORY_EVIDENCE_OUTPUT_DIR/z_image_turbo-resident-tiled.rgb" \
            | tee "$MEMORY_EVIDENCE_OUTPUT_DIR/verifier-result.txt"
      - name: Upload evidence log and bound output artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-evidence-v1-z-image-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/memory-evidence-v1/z-image-turbo.log
            ${{ runner.temp }}/memory-evidence-v1/z-image-turbo-model-inventory.json
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-resident.rgb
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-staged.rgb
            ${{ runner.temp }}/memory-evidence-v1/z_image_turbo-resident-tiled.rgb
            ${{ runner.temp }}/memory-evidence-v1/verifier-result.txt

